.spacer{height:20px}
</style>
</head>

// ── Firebase ──
function loadSaved(){
  document.getElementById('saveTime').textContent='불러오는 중...';
  fetch(FIREBASE_URL+'/bakery.json').then(r=>r.json()).then(p=>{
    if(p&&p.products){ PRODUCTS=p.products; }
    if(p&&p.dtypes) DTYPES=p.dtypes;
    PRODUCTS.forEach(initQty);
    if(p&&p.allQty) DAYS.forEach(d=>{ if(p.allQty[d]) Object.keys(p.allQty[d]).forEach(k=>{ if(!allQty[d]) allQty[d]={}; allQty[d][k]=p.allQty[d][k]; }); });
    if(p&&p.recipes) RECIPES=p.recipes;
    if(p&&p.offsets) OFFSETS=p.offsets;
    if(p&&p.batchMode) BATCH_MODE=p.batchMode;
    if(p&&p.batchQty) DAYS.forEach(d=>{ if(p.batchQty[d]) batchQty[d]={...batchQty[d],...p.batchQty[d]}; });
    const t=localStorage.getItem('bakery_savetime');
    document.getElementById('saveTime').textContent=t||'--';
    renderQtyTable();
  }).catch(()=>{ document.getElementById('saveTime').textContent='오프라인'; renderQtyTable(); });
}
function saveData(){
  const now=new Date(); const str=`${now.getMonth()+1}/${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById('saveTime').textContent='저장 중...';
  fetch(FIREBASE_URL+'/bakery.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({allQty,recipes:RECIPES,products:PRODUCTS,dtypes:DTYPES,offsets:OFFSETS,batchMode:BATCH_MODE,batchQty})})
    .then(()=>{ localStorage.setItem('bakery_savetime',str); document.getElementById('saveTime').textContent=str; showToast('저장했습니다'); })
    .catch(()=>showToast('저장 실패'));
}
function pad(n){ return String(n).padStart(2,'0'); }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ── 수량 테이블 ──
function renderQtyTable(){
  const wrap=document.getElementById('qtyWrap');
  let rowCounter=0;
  let h='<table><thead><tr><th class="name-col">제품 (분할g)</th>';
  DAYS.forEach(d=>{
    const wk=(d==='토'||d==='일')?' weekend':'';
    const sel=selDays.includes(d)?' sel':'';
    h+=`<th class="day-col${wk}${sel}" onclick="toggleDay('${d}')">${d}</th>`;
  });
  h+='</tr></thead><tbody>';
  DTYPES.forEach(dtype=>{
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const isBatch=BATCH_MODE[dtype];
    h+=`<tr class="sec-row"><td colspan="${DAYS.length+1}"><div class="sec-inner"><span>${dtype}${isBatch?' <span class="batch-tag">배합수 입력</span>':''}</span><div style="display:flex;gap:5px"><button class="sec-mode" onclick="toggleBatchMode('${dtype}')">${isBatch?'개수로':'배합수로'}</button><button class="sec-del" onclick="delDtype('${dtype}')">삭제</button></div></div></td></tr>`;

    // 배합수 직접입력 모드 — 제품별 배합수 입력
    if(isBatch){
      prods.forEach(p=>{
        const rowIdx=rowCounter++;
        h+=`<tr class="batch-input-row"><td class="name-cell" onclick="openEditProd('${p.name.replace(/'/g,"\\'")}')"><div class="p-name">${p.name}</div><div class="p-split">${p.split}g · 배합수</div></td>`;
        DAYS.forEach((d,di)=>{
          const v=batchQty[d]?.[p.name]??0;
          const zc=v===0?' zero':'';
          const sc=selDays.includes(d)?' sel-day':'';
          h+=`<td class="qty-cell"><input class="q-inp batch-inp-cell${zc}${sc}" type="number" min="0" step="0.1" value="${v}" data-day="${d}" data-col="${di}" data-row="${rowIdx}" data-name="${p.name.replace(/"/g,'&quot;')}" oninput="onBatchQty(this)" onkeydown="onCellKey(event,this)"></td>`;
        });
        h+='</tr>';
      });
      // 반죽 합계 행
      h+=`<tr class="batch-sum-row"><td class="name-cell" style="cursor:default"><div class="p-name">${dtype} 합계</div><div class="p-split">자동 합산</div></td>`;
      DAYS.forEach(d=>{
        const sum=prods.reduce((s,p)=>s+(batchQty[d]?.[p.name]||0),0);
        h+=`<td class="batch-sum-cell">${sum>0?sum.toFixed(1):'<span style="color:#ddd">-</span>'}</td>`;
      });
      h+='</tr>';
      h+=`<tr class="add-row"><td colspan="${DAYS.length+1}"><div class="add-inner" onclick="openAddProd('${dtype}')"><div class="add-ico">+</div><span class="add-lbl">${dtype} 제품 추가</span></div></td></tr>`;
      return;
    }

    prods.forEach(p=>{
      const rowIdx=rowCounter++;
      h+=`<tr><td class="name-cell" onclick="openEditProd('${p.name.replace(/'/g,"\\'")}')"><div class="p-name">${p.name}</div><div class="p-split">${p.split}g</div></td>`;
      DAYS.forEach((d,di)=>{
        const v=allQty[d]?.[p.name]??0;
        const zc=v===0?' zero':'';
        const sc=selDays.includes(d)?' sel-day':'';
        h+=`<td class="qty-cell"><input class="q-inp${zc}${sc}" type="number" min="0" value="${v}" data-day="${d}" data-col="${di}" data-row="${rowIdx}" data-name="${p.name.replace(/"/g,'&quot;')}" oninput="onQty(this)" onkeydown="onCellKey(event,this)"></td>`;
      });
      h+='</tr>';
    });
    h+=`<tr class="add-row"><td colspan="${DAYS.length+1}"><div class="add-inner" onclick="openAddProd('${dtype}')"><div class="add-ico">+</div><span class="add-lbl">${dtype} 제품 추가</span></div></td></tr>`;
  });
  h+='</tbody></table>';
  wrap.innerHTML=h;
}

function onQty(el){
  const day=el.dataset.day, name=el.dataset.name;
  const val=Math.max(0,parseInt(el.value)||0);
  if(selDays.length>0 && selDays.includes(day)){
    // 선택된 모든 요일에 적용
    selDays.forEach(d=>{ if(allQty[d]) allQty[d][name]=val; });
    // 화면의 같은 제품 다른 선택요일 셀도 업데이트
    document.querySelectorAll(`.q-inp[data-name="${CSS.escape(name)}"]`).forEach(inp=>{
      if(selDays.includes(inp.dataset.day)&&inp!==el){ inp.value=val; inp.classList.toggle('zero',val===0); }
    });
  } else {
    allQty[day][name]=val;
  }
  el.classList.toggle('zero',val===0);
  if(curTab==='result') renderResultTable();
}

function onBatchQty(el){
  const day=el.dataset.day, name=el.dataset.name;
  const val=Math.max(0,parseFloat(el.value)||0);
  if(selDays.length>0 && selDays.includes(day)){
    selDays.forEach(d=>{ if(!batchQty[d]) batchQty[d]={}; batchQty[d][name]=val; });
    document.querySelectorAll(`.batch-inp-cell[data-name="${CSS.escape(name)}"]`).forEach(inp=>{
      if(selDays.includes(inp.dataset.day)&&inp!==el){ inp.value=val; inp.classList.toggle('zero',val===0); }
    });
  } else {
    if(!batchQty[day]) batchQty[day]={};
    batchQty[day][name]=val;
  }
  el.classList.toggle('zero',val===0);
  updateBatchSums();
  if(curTab==='result') renderResultTable();
}

// 배합수 모드 반죽의 합계 행 갱신
function updateBatchSums(){
  DTYPES.forEach(dtype=>{
    if(!BATCH_MODE[dtype]) return;
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const rows=document.querySelectorAll('.batch-sum-row');
    rows.forEach(row=>{
      const lbl=row.querySelector('.p-name')?.textContent||'';
      if(lbl!==dtype+' 합계') return;
      const cells=row.querySelectorAll('.batch-sum-cell');
      DAYS.forEach((d,i)=>{
        const sum=prods.reduce((s,p)=>s+(batchQty[d]?.[p.name]||0),0);
        if(cells[i]) cells[i].innerHTML=sum>0?sum.toFixed(1):'<span style="color:#ddd">-</span>';
      });
    });
  });
}

function toggleBatchMode(dtype){
  BATCH_MODE[dtype]=!BATCH_MODE[dtype];
  renderQtyTable();
  showToast(BATCH_MODE[dtype]?`'${dtype}' 배합수 직접 입력 모드`:`'${dtype}' 개수 입력 모드`);
}

// Tab/Enter → 같은 요일의 다음 제품(아래)으로 이동
function onCellKey(e,el){
  if(e.key!=='Tab'&&e.key!=='Enter') return;
  e.preventDefault();
  const col=el.dataset.col, row=parseInt(el.dataset.row);
  const dir=e.shiftKey?-1:1;
  const next=document.querySelector(`.q-inp[data-col="${col}"][data-row="${row+dir}"]`);
  if(next){ next.focus(); next.select(); }
  else {
    // 끝이면 다음/이전 요일 첫 행으로
    const nc=parseInt(col)+dir;
    const wrapEl=document.querySelector(`.q-inp[data-col="${nc}"][data-row="${dir>0?0:row}"]`);
    if(wrapEl){ wrapEl.focus(); wrapEl.select(); }
  }
}

function resetWeek(){
  if(!confirm('전체 요일 수량을 기본값으로 초기화할까요?')) return;
  PRODUCTS.forEach(p=>DAYS.forEach(d=>{ allQty[d][p.name]=p[DAY_TYPE[d]]; }));
  renderQtyTable(); showToast('초기화했습니다');
}

// ── 배합수 테이블 ──
// 계량일(day)에서 offset일 후의 판매 요일 반환
function saleDay(day,offset){
  const i=DAYS.indexOf(day);
  return DAYS[(i+(offset||0))%7];
}

// 제품 p의 판매일 수량 (계량일 day 기준)
function qtyFor(p,day){
  const off=OFFSETS[p.name]||0;
  return (allQty[saleDay(day,off)]||{})[p.name]||0;
}

function calcBatchesFor(day){
  const result={};
  // 식빵은 다른 반죽의 묵반 소요량을 참조하므로 마지막에 계산
  const order=[...DTYPES.filter(d=>d!=='식빵'),...DTYPES.filter(d=>d==='식빵')];
  order.forEach(dtype=>{
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const recipe=RECIPE_TOTALS[dtype]; if(!recipe||!prods.length) return;
    let batches,total_g;
    // 배합수 직접입력 모드 — 제품별 배합수를 각자의 오프셋으로 합산
    if(BATCH_MODE[dtype]){
      batches=prods.reduce((s,p)=>{
        const off=OFFSETS[p.name]||0;
        return s+(batchQty[saleDay(day,off)]?.[p.name]||0);
      },0);
      batches=Math.round(batches*10)/10;
      total_g=batches*recipe;
      result[dtype]={batches,total_g,direct:true};
      return;
    }
    if(dtype==='식빵'){
      // 소금빵 + 초코모닝빵 + 다른 반죽에 들어가는 묵반 소요량
      const ownG=prods.reduce((s,p)=>s+qtyFor(p,day)*p.split,0);
      // 묵반을 쓰는 반죽들의 배합수 합 (탕종식빵, 모카빵, 잡곡류)
      const mukbanUsers=['탕종식빵','모카빵','잡곡모닝','잡곡식빵'];
      const mukbanB=mukbanUsers.reduce((s,dt)=>s+(result[dt]?.batches||0),0);
      const need=ownG+mukbanB*MUKBAN;
      batches=need>0?Math.ceil(need/(SIK_TOTAL-MUKBAN)*10)/10:0;
      total_g=batches*(SIK_TOTAL-MUKBAN);
    } else {
      total_g=prods.reduce((s,p)=>s+qtyFor(p,day)*p.split,0);
      batches=total_g>0?Math.ceil(total_g/recipe*10)/10:0;
    }
    result[dtype]={batches,total_g};
  });
  return result;
}

let expandedDtypes={};  // 반죽별 제품 목록 펼침 상태

function renderResultTable(){
  const wrap=document.getElementById('resultWrap');
  const byDay={}; DAYS.forEach(d=>byDay[d]=calcBatchesFor(d));
  let h='<table><thead><tr><th class="name-col">반죽 / 제품</th><th class="off-col">생산일</th>';
  DAYS.forEach(d=>{ const wk=(d==='토'||d==='일')?' weekend':''; h+=`<th class="day-col${wk}">${d}</th>`; });
  h+='</tr></thead><tbody>';
  const totals={}; DAYS.forEach(d=>totals[d]=0);

  DTYPES.forEach(dtype=>{
    if(!RECIPE_TOTALS[dtype]) return;
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    if(!prods.length) return;
    const hasAny=DAYS.some(d=>byDay[d][dtype]?.batches>0)||BATCH_MODE[dtype];
    if(!hasAny) return;
    const isOpen=expandedDtypes[dtype];
    // 반죽 행
    h+=`<tr class="batch-row"><td class="name-cell dtype-cell" onclick="toggleDtypeProds('${dtype}')">
      <span class="exp-arrow">${isOpen?'&#9662;':'&#9656;'}</span>${dtype}${BATCH_MODE[dtype]?'<span class="direct-tag">직접</span>':''}</td>`;
    h+=`<td class="off-cell off-mixed">${mixedOffsetLabel(prods)}</td>`;
    DAYS.forEach(d=>{
      const b=byDay[d][dtype]?.batches||0;
      totals[d]+=b;
      h+=`<td>${b>0?b.toFixed(1):'<span style="color:#ddd">-</span>'}</td>`;
    });
    h+='</tr>';
    // 제품별 생산일 입력 행 (펼쳐진 경우)
    if(isOpen){
      if(BATCH_MODE[dtype]){
        prods.forEach(p=>{
          const off=OFFSETS[p.name]||0;
          h+=`<tr class="prod-off-row"><td class="name-cell prod-sub-cell">${p.name}<span class="prod-g">배합수</span></td>`;
          h+=`<td class="off-cell"><input class="off-inp" type="number" min="0" max="6" value="${off}" data-pname="${p.name.replace(/"/g,'&quot;')}" oninput="onOffset(this)"><span class="off-hint">${off===0?'당일':'+'+off}</span></td>`;
          DAYS.forEach(d=>{
            const sd=saleDay(d,off);
            const b=batchQty[sd]?.[p.name]||0;
            h+=`<td class="prod-q">${b>0?b.toFixed(1):'<span style="color:#ddd">-</span>'}<span class="sale-day">${sd}</span></td>`;
          });
          h+='</tr>';
        });
      } else {
      prods.forEach(p=>{
        const off=OFFSETS[p.name]||0;
        h+=`<tr class="prod-off-row"><td class="name-cell prod-sub-cell">${p.name}<span class="prod-g">${p.split}g</span></td>`;
        h+=`<td class="off-cell"><input class="off-inp" type="number" min="0" max="6" value="${off}" data-pname="${p.name.replace(/"/g,'&quot;')}" oninput="onOffset(this)"><span class="off-hint">${off===0?'당일':'+'+off}</span></td>`;
        DAYS.forEach(d=>{
          const sd=saleDay(d,off);
          const q=(allQty[sd]||{})[p.name]||0;
          h+=`<td class="prod-q">${q>0?q:'<span style="color:#ddd">-</span>'}<span class="sale-day">${sd}</span></td>`;
        });
        h+='</tr>';
      });
      }
    }
  });

  h+='<tr class="batch-row total-row"><td class="name-cell">합계</td><td class="off-cell"></td>';
  DAYS.forEach(d=>{ h+=`<td>${totals[d].toFixed(1)}</td>`; });
  h+='</tr></tbody></table>';
  h+='<div class="off-guide"><b>반죽 이름을 탭하면</b> 제품별 생산일을 설정할 수 있습니다.<br>생산일 0=계량 당일 판매, 1=다음 날, 2=이틀 뒤 &nbsp;|&nbsp; 배합수는 <b>계량하는 날</b> 기준입니다.</div>';
  wrap.innerHTML=h;
}

// 반죽 내 제품들의 오프셋 요약 표시
function mixedOffsetLabel(prods){
  const offs=[...new Set(prods.map(p=>OFFSETS[p.name]||0))];
  if(offs.length===1) return `<span class="off-summary">${offs[0]===0?'당일':'+'+offs[0]+'일'}</span>`;
  return `<span class="off-summary mixed">혼합</span>`;
}

function toggleDtypeProds(dtype){
  expandedDtypes[dtype]=!expandedDtypes[dtype];
  renderResultTable();
}

function onOffset(el){
  const v=Math.max(0,Math.min(6,parseInt(el.value)||0));
  const bd=el.dataset.batchdtype;
  if(bd){
    // 배합수 모드: 소속 제품 전체에 동일 적용
    PRODUCTS.filter(p=>p.dtype===bd).forEach(p=>{ OFFSETS[p.name]=v; });
  } else {
    OFFSETS[el.dataset.pname]=v;
  }
  renderResultTable();
}

// ── 모달 ──
let modalMode=null, modalData={};
function openModal(title,sub,body,ok,mode,data){
  modalMode=mode; modalData=data||{};
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalSub').textContent=sub;
  document.getElementById('modalBody').innerHTML=body;
  document.getElementById('modalOk').textContent=ok||'확인';
  document.getElementById('modalDelBtn').innerHTML='';
  document.getElementById('modalBg').classList.add('show');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('show'); modalMode=null; }
function modalOk(){
  if(modalMode==='addDtype') doAddDtype();
  else if(modalMode==='addProd') doAddProd();
  else if(modalMode==='editProd') doEditProd();
}
function openAddDtype(){
  openModal('새 반죽 추가','레시피 이름과 같게 하면 배합수가 자동 계산됩니다',
    `<div class="modal-row"><label>반죽 이름</label><input class="modal-inp" id="mi-dtype" placeholder="예: 하드계열"></div>`,'추가','addDtype');
}
function doAddDtype(){
  const n=document.getElementById('mi-dtype')?.value?.trim();
  if(!n){ showToast('이름을 입력하세요'); return; }
  if(DTYPES.includes(n)){ showToast('이미 존재합니다'); return; }
  DTYPES.push(n); closeModal(); renderQtyTable(); showToast(`'${n}' 추가됨`);
}
function delDtype(dtype){
  const c=PRODUCTS.filter(p=>p.dtype===dtype).length;
  if(!confirm(`'${dtype}'와 소속 제품 ${c}개를 삭제할까요?`)) return;
  PRODUCTS=PRODUCTS.filter(p=>p.dtype!==dtype);
  DTYPES=DTYPES.filter(d=>d!==dtype);
  renderQtyTable(); showToast(`'${dtype}' 삭제됨`);
}
function openAddProd(dtype){
  openModal(`${dtype} 제품 추가`,'제품명과 분할 중량을 입력하세요',
    `<div class="modal-row"><label>제품명</label><input class="modal-inp" id="mi-pname" placeholder="예: 크랜베리 식빵"></div>
     <div class="modal-row"><label>분할 중량 (g)</label><input class="modal-inp" id="mi-split" type="number" min="1" placeholder="200"></div>
     <div class="modal-row"><label>기본 수량 - 평일(월~목)</label><input class="modal-inp" id="mi-wd" type="number" min="0" value="0"></div>
     <div class="modal-row"><label>기본 수량 - 주말(금~토)</label><input class="modal-inp" id="mi-sat" type="number" min="0" value="0"></div>
     <div class="modal-row"><label>기본 수량 - 일요일</label><input class="modal-inp" id="mi-sun" type="number" min="0" value="0"></div>`,
    '추가','addProd',{dtype});
}
function doAddProd(){
  const name=document.getElementById('mi-pname')?.value?.trim();
  const split=parseFloat(document.getElementById('mi-split')?.value)||0;
  const wd=parseInt(document.getElementById('mi-wd')?.value)||0;
  const sat=parseInt(document.getElementById('mi-sat')?.value)||0;
  const sun=parseInt(document.getElementById('mi-sun')?.value)||0;
  if(!name||!split){ showToast('제품명과 중량을 입력하세요'); return; }
  if(PRODUCTS.find(p=>p.name===name)){ showToast('이미 존재하는 제품입니다'); return; }
  const prod={name,dtype:modalData.dtype,split,sun,wd,sat};
  PRODUCTS.push(prod); initQty(prod);
  closeModal(); renderQtyTable(); showToast(`'${name}' 추가됨`);
}
function openEditProd(name){
  const p=PRODUCTS.find(x=>x.name===name); if(!p) return;
  openModal(`제품 편집`,name,
    `<div class="modal-row"><label>제품명</label><input class="modal-inp" id="mi-pname" value="${p.name}"></div>
     <div class="modal-row"><label>분할 중량 (g)</label><input class="modal-inp" id="mi-split" type="number" value="${p.split}"></div>
     <div class="modal-row"><label>기본 수량 - 평일(월~목)</label><input class="modal-inp" id="mi-wd" type="number" value="${p.wd}"></div>
     <div class="modal-row"><label>기본 수량 - 주말(금~토)</label><input class="modal-inp" id="mi-sat" type="number" value="${p.sat}"></div>
     <div class="modal-row"><label>기본 수량 - 일요일</label><input class="modal-inp" id="mi-sun" type="number" value="${p.sun}"></div>`,
    '저장','editProd',{oldName:name});
  document.getElementById('modalDelBtn').innerHTML=`<button class="modal-del" onclick="delProd('${name.replace(/'/g,"\\'")}')">삭제</button>`;
}
function doEditProd(){
  const oldName=modalData.oldName;
  const newName=document.getElementById('mi-pname')?.value?.trim();
  const split=parseFloat(document.getElementById('mi-split')?.value)||0;
  const wd=parseInt(document.getElementById('mi-wd')?.value)||0;
  const sat=parseInt(document.getElementById('mi-sat')?.value)||0;
  const sun=parseInt(document.getElementById('mi-sun')?.value)||0;
  if(!newName||!split){ showToast('제품명과 중량을 입력하세요'); return; }
  const p=PRODUCTS.find(x=>x.name===oldName); if(!p) return;
  if(newName!==oldName) DAYS.forEach(d=>{ if(allQty[d]){ allQty[d][newName]=allQty[d][oldName]; delete allQty[d][oldName]; } });
  Object.assign(p,{name:newName,split,wd,sat,sun});
  closeModal(); renderQtyTable(); showToast('수정됨');
}
function delProd(name){
  closeModal();
  if(!confirm(`'${name}' 제품을 삭제할까요?`)) return;
  PRODUCTS=PRODUCTS.filter(p=>p.name!==name);
  DAYS.forEach(d=>{ if(allQty[d]) delete allQty[d][name]; });
  renderQtyTable(); showToast('삭제됨');
}

// ── 레시피 탭 ──
function flourTotal(ings){ return ings.filter(i=>i.type==='flour').reduce((s,i)=>s+i.g,0); }
function typeOptions(sel){ return Object.entries(ING_TYPES).map(([k,t])=>`<option value="${k}" ${k===sel?'selected':''}>${t.label}</option>`).join(''); }
function renderRecipes(){
  const list=document.getElementById('recipeList'); list.innerHTML='';
  Object.entries(RECIPES).forEach(([key,rec])=>{
    const card=document.createElement('div'); card.className='recipe-card';
    card.innerHTML=`<div class="recipe-hdr" onclick="toggleR('${key}')"><span class="recipe-title">${rec.label}</span><div style="display:flex;align-items:center;gap:6px" onclick="event.stopPropagation()"><div class="batch-wrap"><span class="batch-lbl">배합</span><input class="batch-inp" type="number" min="0.1" step="0.1" value="1" id="batch-${key}" oninput="updateView('${key}')"></div><span id="chev-${key}" style="font-size:14px;color:#ccc">&#9660;</span></div></div><div id="rbody-${key}" style="display:none"><div class="ing-hdr"><span>재료</span><div style="display:flex;gap:8px"><span style="min-width:52px;text-align:right">베이커스%</span><span style="min-width:62px;text-align:right">사용량(g)</span></div></div><div id="ing-view-${key}"></div><div class="recipe-footer"><span style="font-size:13px;color:#888">밀가루합계 / 총무게</span><span style="font-size:13px;font-weight:600" id="total-${key}">-</span></div><div style="padding:8px 14px;border-top:1px solid #f0f0f0;display:flex;flex-wrap:wrap;align-items:center;gap:8px"><button class="edit-toggle-btn" onclick="toggleEdit('${key}')">레시피 편집</button><div style="display:flex;gap:5px;flex-wrap:wrap">${Object.entries(ING_TYPES).map(([k,t])=>`<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:#888"><span style="width:7px;height:7px;border-radius:50%;background:${t.color};display:inline-block"></span>${t.label}</span>`).join('')}</div></div><div id="edit-${key}" style="display:none"></div></div>`;
    list.appendChild(card); updateView(key);
  });
}
function updateView(key){
  const rec=RECIPES[key]; const b=parseFloat(document.getElementById('batch-'+key)?.value)||1;
  const ft=flourTotal(rec.ings); const c=document.getElementById('ing-view-'+key); const te=document.getElementById('total-'+key);
  if(!c) return;
  c.innerHTML=rec.ings.map(i=>{ const t=ING_TYPES[i.type||'other']; const gv=i.g*b; const gs=gv>=100?Math.round(gv).toString():(gv>=10?gv.toFixed(1):gv.toFixed(2)); return `<div class="ing-row"><div class="ing-dot" style="background:${t.color}"></div><span class="ing-n">${i.n}</span><span class="ing-pct">${typeof i.pct==='number'?i.pct.toFixed(1)+'%':'--'}</span><span class="ing-g">${gs}g</span></div>`; }).join('');
  if(te){ const tot=rec.ings.reduce((s,i)=>s+i.g,0)*b; te.textContent=`${Math.round(ft*b).toLocaleString()}g / ${Math.round(tot).toLocaleString()}g`; }
}
function toggleR(key){ const b=document.getElementById('rbody-'+key); const c=document.getElementById('chev-'+key); const o=b.style.display==='none'; b.style.display=o?'block':'none'; c.innerHTML=o?'&#9650;':'&#9660;'; if(o) updateView(key); }
function toggleEdit(key){ const e=document.getElementById('edit-'+key); const o=e.style.display==='none'; e.style.display=o?'block':'none'; if(o) renderEditForm(key); }
function renderEditForm(key){ const rec=RECIPES[key]; const e=document.getElementById('edit-'+key); const ft=flourTotal(rec.ings); e.innerHTML=`<div class="edit-section"><div class="flour-info">밀가루 합계: <span id="ef-${key}" style="color:#f59e0b;font-weight:700">${ft.toFixed(1)}g</span></div><div id="erows-${key}"></div><button class="add-ing-btn" onclick="addIng('${key}')">+ 재료 추가</button><button class="apply-btn" onclick="saveRecipe('${key}')">레시피 적용</button></div>`; renderERows(key); }
function renderERows(key){ const rec=RECIPES[key]; const c=document.getElementById('erows-'+key); if(!c) return; c.innerHTML=rec.ings.map((ing,i)=>`<div class="erow"><div class="ecol" style="flex:2"><label>재료명</label><input class="einp" type="text" value="${ing.n}" id="en-${key}-${i}" oninput="RECIPES['${key}'].ings[${i}].n=this.value"></div><div class="ecol" style="width:64px"><label>g</label><input class="einp eg" type="number" min="0" step="0.1" value="${ing.g}" id="eg-${key}-${i}" oninput="onG('${key}',${i})"></div><div class="ecol" style="width:58px"><label>%</label><input class="einp ep" type="number" min="0" step="0.1" value="${typeof ing.pct==='number'?ing.pct:0}" id="ep-${key}-${i}" oninput="onP('${key}',${i})"></div><div class="ecol" style="width:68px"><label>종류</label><select class="esel" id="et-${key}-${i}" onchange="onT('${key}',${i})">${typeOptions(ing.type||'other')}</select></div><button class="del-ing-btn" onclick="delIng('${key}',${i})">&#215;</button></div>`).join(''); }
function onG(key,i){ const r=RECIPES[key]; r.ings[i].g=parseFloat(document.getElementById('eg-'+key+'-'+i)?.value)||0; const ft=flourTotal(r.ings); if(ft>0) r.ings.forEach((ing,x)=>{ ing.pct=parseFloat((ing.g/ft*100).toFixed(2)); const el=document.getElementById('ep-'+key+'-'+x); if(el) el.value=ing.pct; }); const f=document.getElementById('ef-'+key); if(f) f.textContent=ft.toFixed(1)+'g'; updateView(key); }
function onP(key,i){ const r=RECIPES[key]; const p=parseFloat(document.getElementById('ep-'+key+'-'+i)?.value)||0; r.ings[i].pct=p; const ft=flourTotal(r.ings); if(ft>0){ const g=parseFloat((p/100*ft).toFixed(2)); r.ings[i].g=g; const el=document.getElementById('eg-'+key+'-'+i); if(el) el.value=g; } updateView(key); }
function onT(key,i){ const r=RECIPES[key]; const o=r.ings[i].type; const n=document.getElementById('et-'+key+'-'+i)?.value; r.ings[i].type=n; if(o==='flour'||n==='flour'){ const ft=flourTotal(r.ings); if(ft>0) r.ings.forEach((ing,x)=>{ ing.pct=parseFloat((ing.g/ft*100).toFixed(2)); const el=document.getElementById('ep-'+key+'-'+x); if(el) el.value=ing.pct; }); const f=document.getElementById('ef-'+key); if(f) f.textContent=ft.toFixed(1)+'g'; } updateView(key); }
function addIng(key){ RECIPES[key].ings.push({n:'',g:0,pct:0,type:'other'}); renderERows(key); }
function delIng(key,i){ if(!confirm('재료를 삭제할까요?')) return; RECIPES[key].ings.splice(i,1); const ft=flourTotal(RECIPES[key].ings); if(ft>0) RECIPES[key].ings.forEach(ing=>{ ing.pct=parseFloat((ing.g/ft*100).toFixed(2)); }); renderERows(key); updateView(key); const f=document.getElementById('ef-'+key); if(f) f.textContent=ft.toFixed(1)+'g'; }
function saveRecipe(key){ RECIPES[key].total=RECIPES[key].ings.reduce((s,i)=>s+i.g,0); document.getElementById('edit-'+key).style.display='none'; updateView(key); showToast('적용됨 - 저장 버튼으로 서버 반영'); }

function switchTab(tab){
  curTab=tab;
  ['qty','result','recipe'].forEach(t=>{ document.getElementById(t+'Tab').style.display=t===tab?'block':'none'; document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active',t===tab); });
  document.getElementById('multiBar').style.display=(tab==='qty'&&selDays.length>0)?'flex':'none';
  if(tab==='result') renderResultTable();
  if(tab==='recipe') renderRecipes();
}

loadSaved();
renderQtyTable();
</script>
