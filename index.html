<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="반죽 계량표">
<title>반죽 계량표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#111;font-size:15px;min-height:100vh}
.hdr{background:#1a1a2e;color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:20}
.hdr-title{font-size:17px;font-weight:600;flex:1}
.save-info{text-align:right}
.save-lbl{font-size:10px;color:rgba(255,255,255,0.45);display:block}
.save-time{font-size:12px;color:rgba(255,255,255,0.8);display:block;min-width:80px}
.day-bar{background:#111827;padding:8px 12px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.day-bar::-webkit-scrollbar{display:none}
.day-btn{padding:6px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.25);background:transparent;color:rgba(255,255,255,0.7);font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
.day-btn.active{background:#fff;color:#1a1a2e;border-color:#fff;font-weight:600}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:54px;z-index:19}
.tab{flex:1;padding:11px 0;text-align:center;font-size:13px;color:#888;cursor:pointer;border-bottom:2.5px solid transparent;font-family:inherit}
.tab.active{color:#1a1a2e;border-color:#1a1a2e;font-weight:600}
.action-bar{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e8e8e8}
.save-btn{flex:1;padding:10px;border-radius:9px;background:#1a1a2e;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.save-btn:active{opacity:0.85;transform:scale(0.98)}
.reset-btn{padding:10px 16px;border-radius:9px;background:transparent;color:#666;border:1.5px solid #ddd;font-size:13px;cursor:pointer;font-family:inherit}
.reset-btn:active{background:#f0f0f0}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:rgba(20,20,35,0.92);color:#fff;font-size:13px;padding:9px 20px;border-radius:22px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;bottom:24px;z-index:100;backdrop-filter:blur(4px)}
.toast.show{opacity:1}
.sec-label{font-size:11px;font-weight:600;color:#999;letter-spacing:.07em;text-transform:uppercase;padding:14px 16px 5px;background:#f5f5f5}
.prod-row{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid #f0f0f0}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14px;color:#111;font-weight:500}
.prod-sub{font-size:11px;color:#aaa;margin-top:1px}
.qty-ctrl{display:flex;align-items:center;gap:0;flex-shrink:0}
.qb{width:34px;height:34px;border-radius:8px;border:1.5px solid #ddd;background:#f8f8f8;color:#333;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none;font-family:inherit}
.qb:active{background:#ebebeb;transform:scale(0.93)}
.qinput{width:48px;text-align:center;font-size:16px;font-weight:600;border:none;background:transparent;color:#111;padding:0;font-family:inherit;-moz-appearance:textfield}
.qinput::-webkit-inner-spin-button,.qinput::-webkit-outer-spin-button{-webkit-appearance:none}
.rcard{background:#fff;border-radius:12px;margin:12px 16px;overflow:hidden;border:1px solid #eee}
.rcard-hdr{padding:12px 14px 10px;font-size:12px;font-weight:600;color:#666;letter-spacing:.04em;border-bottom:1px solid #f0f0f0;text-transform:uppercase}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid #f5f5f5}
.rrow:last-child{border-bottom:none}
.rname{font-size:14px;font-weight:600;color:#111}
.rsub{font-size:11px;color:#aaa;margin-top:2px}
.rbatch{font-size:24px;font-weight:700;color:#1a1a2e}
.rbatch-unit{font-size:12px;color:#999;display:block;text-align:right}
.rtotal{display:flex;justify-content:space-between;align-items:center;background:#1a1a2e;padding:13px 16px;margin:0 16px 16px;border-radius:10px}
.rtotal-lbl{font-size:14px;color:rgba(255,255,255,0.65)}
.rtotal-val{font-size:20px;font-weight:700;color:#fff}
.recipe-card{background:#fff;border-radius:12px;border:1px solid #eee;margin:0 16px 10px;overflow:hidden}
.recipe-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.recipe-title{font-size:14px;font-weight:600;color:#111}
.recipe-badge{font-size:11px;color:#888;background:#f5f5f5;border-radius:5px;padding:3px 8px}
.chevron{font-size:18px;color:#ccc;transition:transform .2s;display:inline-block}
.recipe-body{border-top:1px solid #f0f0f0}
.recipe-row{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #f8f8f8}
.recipe-row:last-child{border-bottom:none}
.recipe-row:nth-child(odd){background:#fafafa}
.ing-name{font-size:13px;color:#555}
.ing-val{font-size:13px;font-weight:600;color:#111}
.ing-pct{font-size:11px;color:#aaa;margin-left:3px;font-weight:400}
.recipe-total{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid #eee;background:#f9f9f9}
.empty{text-align:center;padding:40px 20px;color:#bbb;font-size:14px}
.spacer{height:24px}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="hdr">
  <div class="hdr-title">🥖 반죽 계량표</div>
  <div class="save-info">
    <span class="save-lbl">최종 저장</span>
    <span class="save-time" id="saveTime">—</span>
  </div>
</div>

<div class="day-bar" id="dayBar"></div>

<div class="tabs">
  <div class="tab active" id="tabQty" onclick="switchTab('qty')">수량 입력</div>
  <div class="tab" id="tabResult" onclick="switchTab('result')">배합수</div>
  <div class="tab" id="tabRecipe" onclick="switchTab('recipe')">레시피</div>
</div>

<div class="action-bar">
  <button class="save-btn" onclick="saveData()">💾 저장</button>
  <button class="reset-btn" onclick="resetToDefault()">초기화</button>
</div>

<div id="qtyTab"><div id="productList"></div><div class="spacer"></div></div>
<div id="resultTab" style="display:none"></div>
<div id="recipeTab" style="display:none"><div style="height:8px"></div><div id="recipeList"></div><div class="spacer"></div></div>

<script>
const DAYS=['월','화','수','목','금','토','일'];
const DAY_TYPE={월:'wd',화:'wd',수:'wd',목:'wd',금:'sat',토:'sat',일:'sun'};
const PRODUCTS=[
  {name:'모닝빵',dtype:'단과자',split:50,sun:72,wd:100,sat:160},
  {name:'단팥빵',dtype:'단과자',split:50,sun:122,wd:160,sat:185},

  {name:'초코 모닝빵',dtype:'식빵',split:29.1,sun:80,wd:120,sat:135},
  {name:'모카빵',dtype:'모카빵',split:150,sun:20,wd:32,sat:34},
  {name:'잡곡모닝',dtype:'잡곡식빵',split:50,sun:117,wd:150,sat:165},
  {name:'잡곡식빵',dtype:'잡곡식빵',split:550,sun:35,wd:38,sat:45},
  {name:'올리브 치아바타',dtype:'치아바타',split:195,sun:48,wd:60,sat:72},
  {name:'치즈 치아바타',dtype:'치아바타',split:190,sun:36,wd:48,sat:48},
  {name:'베지 샌드위치',dtype:'치아바타',split:195,sun:0,wd:16,sat:18},
  {name:'포카치아',dtype:'치아바타',split:155,sun:0,wd:18,sat:18},
  {name:'올리브 바타르',dtype:'바타르',split:442,sun:18,wd:19,sat:28},
  {name:'치즈 바타르',dtype:'바타르',split:350,sun:14,wd:14,sat:19},
  {name:'플레인 바타르',dtype:'바타르',split:400,sun:13,wd:12,sat:15},
  {name:'통밀 바타르',dtype:'바타르',split:250,sun:18,wd:18,sat:24},
  {name:'드미바게트',dtype:'바타르',split:200,sun:0,wd:12,sat:18},
  {name:'올리브치즈 바게트',dtype:'바타르',split:180,sun:0,wd:18,sat:24},
  {name:'고구마 바게트',dtype:'바타르',split:155,sun:0,wd:26,sat:32},
  {name:'무화과 바게트',dtype:'바타르',split:150,sun:0,wd:18,sat:26},
  {name:'초코 바게트',dtype:'바타르',split:250,sun:15,wd:32,sat:40},
  {name:'바게트 샌드위치',dtype:'바타르',split:150,sun:0,wd:16,sat:20},
  {name:'펌퍼니클',dtype:'펌퍼니클',split:450,sun:55,wd:57,sat:65},
  {name:'크루아상',dtype:'크루아상',split:1930,sun:20,wd:25,sat:27},
  {name:'몽크루아상',dtype:'크루아상',split:60,sun:18,wd:28,sat:30},
  {name:'말차큐브',dtype:'크루아상',split:90,sun:15,wd:15,sat:26},
  {name:'초코크로와상',dtype:'크루아상',split:50,sun:20,wd:20,sat:30},
  {name:'애플커스터드',dtype:'크루아상',split:80,sun:20,wd:20,sat:28},
  {name:'앙시오',dtype:'크루아상',split:65,sun:18,wd:18,sat:24},
];
const RECIPE_TOTALS={단과자:2270,식빵:2715,모카빵:3163,잡곡식빵:2300,치아바타:1916.6,바타르:1892,펌퍼니클:2521,크루아상:2505};
const MUKBAN=500,SIK_TOTAL=2715;
const RECIPES={
  단과자:{label:'단과자',total:2270,ings:[{n:'큐원',g:1135,pct:100},{n:'K-블레',g:340,pct:30},{n:'설탕',g:227,pct:20},{n:'소금',g:22.7,pct:2},{n:'생이스트',g:34,pct:3},{n:'버터',g:113.5,pct:10},{n:'전란',g:227,pct:20},{n:'우유',g:113.5,pct:10}]},
  바타르:{label:'바타르',total:1892,ings:[{n:'지라도 T65',g:1000,pct:100},{n:'물',g:700,pct:70},{n:'레드',g:2,pct:0.2},{n:'소금',g:20,pct:2},{n:'바시나주',g:20,pct:2},{n:'호밀 르방',g:150,pct:15}]},
  식빵:{label:'식빵',total:2715,ings:[{n:'K-블레',g:500,pct:50},{n:'큐원',g:500,pct:50},{n:'물',g:470,pct:47},{n:'설탕',g:100,pct:10},{n:'소금',g:20,pct:2},{n:'탈지분유',g:20,pct:2},{n:'생이스트',g:35,pct:3.5},{n:'S500',g:10,pct:1},{n:'버터',g:80,pct:8},{n:'물엿',g:30,pct:3},{n:'생크림',g:50,pct:5},{n:'묵반',g:500,pct:50},{n:'크루 묵반',g:200,pct:20},{n:'탕종',g:200,pct:20}]},
  모카빵:{label:'모카빵',total:3163,ings:[{n:'K-블레',g:1000,pct:100},{n:'물',g:500,pct:50},{n:'설탕',g:150,pct:15},{n:'소금',g:18,pct:1.8},{n:'생이스트',g:25,pct:2.5},{n:'버터',g:100,pct:10},{n:'전란',g:200,pct:20},{n:'모카피',g:1000,pct:100}]},
  잡곡식빵:{label:'잡곡식빵',total:2300,ings:[{n:'K-블레',g:1000,pct:100},{n:'물',g:580,pct:58},{n:'설탕',g:80,pct:8},{n:'소금',g:20,pct:2},{n:'생이스트',g:30,pct:3},{n:'버터',g:60,pct:6},{n:'잡곡미스',g:100,pct:10},{n:'묵반',g:500,pct:50}]},
  펌퍼니클:{label:'펌퍼니클',total:2521,ings:[{n:'크라프트',g:217,pct:72.3},{n:'호밀',g:72.5,pct:24.2},{n:'설탕',g:23,pct:7.7},{n:'소금',g:2,pct:0.7},{n:'트레할로스',g:71.5,pct:23.8},{n:'햄프씨드',g:108.5,pct:36.2},{n:'치아씨드',g:72.5,pct:24.2},{n:'몰트액기스',g:15,pct:5},{n:'물',g:87.5,pct:29.2},{n:'우유',g:350,pct:116.7},{n:'호밀 르방',g:250,pct:83.3},{n:'호두',g:123,pct:41},{n:'꿀',g:28.5,pct:9.5}]},
  크루아상:{label:'크루아상',total:2505,ings:[{n:'큐원',g:375,pct:75},{n:'지라도',g:125,pct:25},{n:'물',g:180,pct:36},{n:'전란',g:25,pct:5},{n:'소금',g:10,pct:2},{n:'설탕',g:70,pct:14},{n:'생이스트',g:22.5,pct:4.5},{n:'엑스트라버터',g:62.5,pct:12.5},{n:'충전용 버터',g:1930,pct:386}]},
  치아바타:{label:'치아바타/포카치아',total:3348,ings:[{n:'T55 풀리쉬',g:450,pct:'풀리쉬'},{n:'물 풀리쉬',g:450,pct:'풀리쉬'},{n:'Dy 풀리쉬',g:18,pct:'풀리쉬'},{n:'T55 본반죽',g:250,pct:'본반죽'},{n:'버터',g:100,pct:'본반죽'},{n:'설탕',g:160,pct:'본반죽'},{n:'소금',g:40,pct:'본반죽'},{n:'DY',g:20,pct:'본반죽'},{n:'우유',g:600,pct:'본반죽'},{n:'물',g:60,pct:'본반죽'},{n:'몰트',g:20,pct:'본반죽'},{n:'롤인버터',g:1200,pct:'충전'}]},
};

let today='월';
const qty={};
PRODUCTS.forEach(p=>qty[p.name]=p[DAY_TYPE['월']]);

function loadSaved(){
  try{
    const d=localStorage.getItem('bakery_data');
    if(d){
      const parsed=JSON.parse(d);
      if(parsed.qty) Object.keys(parsed.qty).forEach(k=>{ if(qty.hasOwnProperty(k)) qty[k]=parsed.qty[k]; });
      if(parsed.day && DAYS.includes(parsed.day)){ today=parsed.day; }
    }
    const t=localStorage.getItem('bakery_savetime');
    if(t) document.getElementById('saveTime').textContent=t;
  }catch(e){}
}

function saveData(){
  try{
    const now=new Date();
    const str=`${now.getMonth()+1}/${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
    localStorage.setItem('bakery_data',JSON.stringify({qty,day:today}));
    localStorage.setItem('bakery_savetime',str);
    document.getElementById('saveTime').textContent=str;
    showToast('저장했습니다');
  }catch(e){ showToast('저장 실패: '+e.message); }
}
function pad(n){ return String(n).padStart(2,'0'); }

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function resetToDefault(){
  if(!confirm(today+'요일 기본 수량으로 초기화할까요?')) return;
  const dt=DAY_TYPE[today];
  PRODUCTS.forEach(p=>qty[p.name]=p[dt]);
  renderProducts();
  showToast('초기화했습니다');
}

// day bar
const dayBar=document.getElementById('dayBar');
DAYS.forEach(d=>{
  const btn=document.createElement('button');
  btn.className='day-btn';
  btn.textContent=d+'요일';
  btn.dataset.day=d;
  btn.onclick=()=>{
    today=d;
    document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===d));
    renderProducts();
    if(curTab==='result') renderResults();
  };
  dayBar.appendChild(btn);
});

function setActiveDay(){
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===today));
}

function getGroups(){
  const g={};
  PRODUCTS.forEach(p=>{ if(!g[p.dtype]) g[p.dtype]=[]; g[p.dtype].push(p); });
  return g;
}

function renderProducts(){
  setActiveDay();
  const list=document.getElementById('productList');
  list.innerHTML='';
  const groups=getGroups();
  Object.entries(groups).forEach(([dtype,prods])=>{
    const lbl=document.createElement('div');
    lbl.className='sec-label'; lbl.textContent=dtype;
    list.appendChild(lbl);
    prods.forEach(p=>{
      const q=qty[p.name]??0;
      const row=document.createElement('div');
      row.className='prod-row';
      row.innerHTML=`
        <div class="prod-info">
          <div class="prod-name">${p.name}</div>
          <div class="prod-sub">${p.split}g/개</div>
        </div>
        <div class="qty-ctrl">
          <div class="qb" onclick="adj('${p.name}',-1)">−</div>
          <input class="qinput" type="number" min="0" value="${q}" onchange="setQ('${p.name}',this.value)" oninput="setQ('${p.name}',this.value)">
          <div class="qb" onclick="adj('${p.name}',1)">+</div>
        </div>`;
      list.appendChild(row);
    });
  });
}

function adj(name,d){
  qty[name]=Math.max(0,(qty[name]||0)+d);
  renderProducts();
  if(curTab==='result') renderResults();
}
function setQ(name,v){
  qty[name]=Math.max(0,parseInt(v)||0);
  if(curTab==='result') renderResults();
}

function calcBatches(){
  const result={};
  const dtypes=[...new Set(PRODUCTS.map(p=>p.dtype))];
  dtypes.forEach(dtype=>{
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const recipe=RECIPE_TOTALS[dtype];
    if(!recipe) return;
    let batches,total_g;
    if(dtype==='식빵'){
      const normal=prods.filter(p=>p.name!=='소금빵'&&p.name!=='초코 모닝빵');
      const normalG=normal.reduce((s,p)=>s+(qty[p.name]||0)*p.split,0);
      const sgG=(qty['소금빵']||0)*70;
      const chocoG=(qty['초코 모닝빵']||0)*29.1;
      const mokaB=result['모카빵']?result['모카빵'].batches:0;
      const normalB=normalG>0?Math.ceil(normalG/(SIK_TOTAL-MUKBAN)*10)/10:0;
      const mukbanG=(normalB+mokaB)*MUKBAN;
      const need=sgG+chocoG+mukbanG;
      batches=need>0?Math.ceil(need/(SIK_TOTAL-MUKBAN)*10)/10:normalB;
      if(normalG>0) batches=Math.max(batches,normalB);
      total_g=batches*(SIK_TOTAL-MUKBAN);
    } else {
      total_g=prods.reduce((s,p)=>s+(qty[p.name]||0)*p.split,0);
      batches=total_g>0?Math.ceil(total_g/recipe*10)/10:0;
    }
    result[dtype]={batches,total_g,recipe};
  });
  return result;
}

function renderResults(){
  const tab=document.getElementById('resultTab');
  const batches=calcBatches();
  const LABEL={단과자:'단과자',식빵:'식빵',모카빵:'모카빵',잡곡식빵:'잡곡식빵',치아바타:'치아바타/포카치아',바타르:'바타르',펌퍼니클:'펌퍼니클',크루아상:'크루아상'};
  let any=false,total=0,rows='';
  Object.entries(batches).forEach(([dtype,d])=>{
    if(!d.batches) return;
    any=true; total+=d.batches;
    rows+=`<div class="rrow">
      <div><div class="rname">${LABEL[dtype]||dtype}</div><div class="rsub">${Math.round(d.total_g).toLocaleString()}g 필요 · 1배합 ${Math.round(d.recipe).toLocaleString()}g</div></div>
      <div style="text-align:right"><div class="rbatch">${d.batches.toFixed(1)}</div><span class="rbatch-unit">배합</span></div>
    </div>`;
  });
  let html=`<div class="rcard"><div class="rcard-hdr">${today}요일 배합수 (0.1 단위 올림)</div>`;
  html+=any?rows:'<div class="empty">수량을 입력하면<br>배합수가 계산됩니다</div>';
  html+='</div>';
  if(any) html+=`<div class="rtotal"><span class="rtotal-lbl">전체 합계</span><span class="rtotal-val">${total.toFixed(1)} 배합</span></div>`;
  html+='<div class="spacer"></div>';
  tab.innerHTML=html;
}

function renderRecipes(){
  const list=document.getElementById('recipeList');
  list.innerHTML='';
  Object.entries(RECIPES).forEach(([key,rec])=>{
    const card=document.createElement('div');
    card.className='recipe-card';
    card.innerHTML=`
      <div class="recipe-hdr" onclick="toggleR('${key}')">
        <span class="recipe-title">${rec.label}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="recipe-badge">1배합 ${Math.round(rec.total).toLocaleString()}g</span>
          <span class="chevron" id="chev-${key}">▾</span>
        </div>
      </div>
      <div id="rbody-${key}" style="display:none">
        <div class="recipe-body">
          ${rec.ings.map(i=>`<div class="recipe-row">
            <span class="ing-name">${i.n}</span>
            <span class="ing-val">${i.g}g<span class="ing-pct">${typeof i.pct==='number'?'('+i.pct+'%)':'('+i.pct+')'}</span></span>
          </div>`).join('')}
        </div>
        <div class="recipe-total">
          <span style="font-size:13px;color:#888">1배합 총무게</span>
          <span style="font-size:13px;font-weight:600">${Math.round(rec.total).toLocaleString()}g</span>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

function toggleR(key){
  const body=document.getElementById('rbody-'+key);
  const chev=document.getElementById('chev-'+key);
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  chev.textContent=open?'▴':'▾';
}

let curTab='qty';
function switchTab(tab){
  curTab=tab;
  ['qty','result','recipe'].forEach(t=>{
    document.getElementById(t+'Tab').style.display=t===tab?'block':'none';
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active',t===tab);
  });
  if(tab==='result') renderResults();
  if(tab==='recipe') renderRecipes();
}

loadSaved();
renderProducts();
</script>
</body>
</html>
