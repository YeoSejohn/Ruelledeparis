<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="반죽 계량표">
<title>반죽 계량표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f5;color:#111;font-size:15px}
.hdr{background:#1a1a2e;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:30}
.hdr-title{font-size:16px;font-weight:600;flex:1}
.save-lbl{font-size:10px;color:rgba(255,255,255,0.45);display:block;text-align:right}
.save-time{font-size:11px;color:rgba(255,255,255,0.8);display:block;text-align:right}
.tabs{display:flex;background:#fff;border-bottom:1px solid #e8e8e8;position:sticky;top:48px;z-index:29}
.tab{flex:1;padding:11px 0;text-align:center;font-size:13px;color:#888;cursor:pointer;border-bottom:2.5px solid transparent;font-family:inherit}
.tab.active{color:#1a1a2e;border-color:#1a1a2e;font-weight:600}
.action-bar{display:flex;gap:8px;padding:9px 14px;background:#fff;border-bottom:1px solid #e8e8e8}
.save-btn{flex:1;padding:9px;border-radius:9px;background:#1a1a2e;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.save-btn:active{opacity:.85}
.reset-btn{padding:9px 13px;border-radius:9px;background:transparent;color:#666;border:1.5px solid #ddd;font-size:13px;cursor:pointer;font-family:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:rgba(20,20,35,0.92);color:#fff;font-size:13px;padding:9px 20px;border-radius:22px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;bottom:24px;z-index:100}
.toast.show{opacity:1}
/* 주간 테이블 */
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff}
.wrap::-webkit-scrollbar{height:5px}
.wrap::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
thead th{position:sticky;top:0;background:#f0f2f5;font-size:11px;font-weight:600;color:#666;padding:8px 4px;text-align:center;border-bottom:1px solid #ddd;white-space:nowrap;z-index:5}
thead th.name-col{position:sticky;left:0;z-index:6;background:#f0f2f5;text-align:left;padding-left:12px;min-width:110px;border-right:1px solid #e0e0e0}
thead th.day-col{min-width:52px;cursor:pointer;user-select:none}
thead th.day-col.sel{background:#3b5bdb;color:#fff}
thead th.day-col.weekend{color:#dc2626}
thead th.day-col.sel.weekend{color:#fff}
.sec-row td{background:#f5f5f5;padding:9px 12px;font-size:11px;font-weight:700;color:#666;letter-spacing:.05em;position:sticky;left:0;border-bottom:1px solid #eee}
.sec-row .sec-inner{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec-del{font-size:10px;color:#dc2626;background:#fee2e2;border:none;border-radius:5px;padding:2px 7px;cursor:pointer;font-family:inherit;flex-shrink:0}
tbody td{padding:0;border-bottom:1px solid #f2f2f2;text-align:center}
td.name-cell{position:sticky;left:0;background:#fff;z-index:4;text-align:left;padding:7px 12px;border-right:1px solid #f0f0f0;cursor:pointer;min-width:110px}
tr:nth-child(even) td.name-cell{background:#fafafa}
tr:nth-child(even) td.qty-cell{background:#fafafa}
.p-name{font-size:13px;color:#111;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;display:flex;align-items:center;gap:5px}
.arrows{display:inline-flex;flex-direction:column;gap:1px;flex-shrink:0;margin-right:3px}
.ar-btn{width:22px;height:15px;border:1px solid #c5cae9;background:#eef2ff;color:#3b5bdb;font-size:8px;line-height:1;border-radius:4px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;font-family:inherit}
.ar-btn:active{background:#3b5bdb;color:#fff}
.ar-btn:disabled{opacity:.25;cursor:default;background:#f5f5f5;border-color:#e0e0e0;color:#bbb}
.sort-btn{padding:9px 12px;border-radius:9px;background:transparent;color:#3b5bdb;border:1.5px solid #c5cae9;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap}
.sort-btn.on{background:#3b5bdb;color:#fff;border-color:#3b5bdb;font-weight:600}
.sec-name{display:flex;align-items:center;gap:6px}
.dt-arrows{margin-right:2px}
.ar-btn.dt-ar{width:24px;height:16px;background:#fff;border-color:#3b5bdb;color:#3b5bdb;font-size:9px}
.ar-btn.dt-ar:active{background:#3b5bdb;color:#fff}
.ar-btn.dt-ar:disabled{opacity:.25;background:#f0f0f0;border-color:#ddd;color:#bbb}
.drag-handle:active{cursor:grabbing;color:#3b5bdb}
.group-box{background:#f8f9ff;border:1px solid #e0e4ff;border-radius:10px;padding:12px}
.day-picks{display:flex;gap:5px;flex-wrap:wrap}
.day-pick{width:34px;height:34px;border-radius:8px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;user-select:none;background:#fff;color:#666}
.day-pick.on{background:#3b5bdb;border-color:#3b5bdb;color:#fff;font-weight:600}
.day-pick.multi.on{background:#e65100;border-color:#e65100}
.grp-tag{display:inline-block;font-size:9px;background:#fff3e0;color:#e65100;border:1px solid #ffcc80;border-radius:4px;padding:0 4px;margin-left:5px;font-weight:600}
.p-split{font-size:10px;color:#aaa;margin-top:1px;white-space:nowrap}
.sl-total{color:#666;font-weight:700}
.sl-detail{color:#e65100;font-size:9px}
td.qty-cell{min-width:52px;padding:0}
.q-inp{width:100%;height:38px;text-align:center;font-size:15px;font-weight:600;border:none;background:transparent;color:#111;font-family:inherit;-moz-appearance:textfield;padding:0}
.q-inp::-webkit-inner-spin-button,.q-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.q-inp:focus{outline:2px solid #3b5bdb;outline-offset:-2px;background:#fff}
.q-inp.zero{color:#ccc}
.q-inp.sel-day{background:#eef2ff}
tr:nth-child(even) .q-inp.sel-day{background:#e5eaff}
/* 배합수 테이블 */
.batch-row td{padding:9px 4px;font-size:15px;font-weight:700;color:#1a1a2e;text-align:center}
.batch-row td.name-cell{font-size:13px;font-weight:600;color:#111;padding:9px 12px}
.batch-row.total-row td{background:#1a1a2e;color:#fff;font-size:14px}
.batch-row.total-row td.name-cell{background:#1a1a2e;color:rgba(255,255,255,.7);font-weight:600}
.batch-sub{font-size:10px;color:#aaa;font-weight:400;display:block;margin-top:1px}
thead th.off-col{min-width:64px;background:#e8eaf6;color:#3b5bdb;font-size:10px}
td.off-cell{min-width:64px;background:#f5f6ff;padding:4px 2px;text-align:center}
tr:nth-child(even) td.off-cell{background:#eef0ff}
.off-inp{width:34px;height:28px;text-align:center;font-size:14px;font-weight:700;border:1.5px solid #c5cae9;border-radius:6px;background:#fff;color:#3b5bdb;font-family:inherit;-moz-appearance:textfield}
.off-inp::-webkit-inner-spin-button,.off-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.off-inp:focus{outline:none;border-color:#3b5bdb}
.off-hint{display:block;font-size:9px;color:#7986cb;margin-top:1px}
.batch-row.total-row td.off-cell{background:#1a1a2e}
.off-guide{padding:12px 14px;font-size:11px;color:#888;line-height:1.6;background:#fff;border-top:1px solid #f0f0f0}
td.dtype-cell{cursor:pointer;user-select:none}
.exp-arrow{display:inline-block;width:14px;color:#999;font-size:11px}
.off-summary{font-size:11px;color:#3b5bdb;font-weight:600}
.off-summary.mixed{color:#f59e0b}
tr.prod-off-row td{background:#fbfcff;border-bottom:1px solid #f0f2ff;padding:5px 2px}
tr.prod-off-row td.name-cell{background:#fbfcff;padding:6px 12px 6px 26px;font-size:12px;color:#555;font-weight:400;cursor:default}
.prod-g{font-size:10px;color:#bbb;margin-left:6px}
td.prod-q{font-size:12px;color:#666;font-weight:500;text-align:center}
.sale-day{display:block;font-size:9px;color:#c5cae9;margin-top:1px}
.batch-tag{font-size:9px;background:#3b5bdb;color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;font-weight:600;letter-spacing:0}
.sec-mode{font-size:10px;color:#3b5bdb;background:#e8eaf6;border:none;border-radius:5px;padding:2px 8px;cursor:pointer;font-family:inherit;flex-shrink:0}
tr.batch-input-row td.name-cell{background:#eef2ff}
tr.batch-input-row td.qty-cell{background:#f5f7ff}
.batch-inp-cell{color:#3b5bdb!important;font-size:16px!important;font-weight:700!important}
.batch-inp-cell.zero{color:#c5cae9!important}
tr.ref-prod-row td{background:#fcfcfc;border-bottom:1px solid #f5f5f5}
tr.ref-prod-row td.name-cell{background:#fcfcfc;padding:5px 12px 5px 22px}
.p-name-sm{font-size:12px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px}
td.ref-cell{color:#ddd;font-size:12px;text-align:center;padding:5px 2px}
.direct-tag{font-size:9px;background:#3b5bdb;color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:600}
tr.batch-sum-row td{background:#e8eaf6;border-bottom:1px solid #c5cae9;border-top:1px solid #c5cae9}
tr.batch-sum-row td.name-cell{background:#e8eaf6}
tr.batch-sum-row .p-name{color:#3b5bdb;font-weight:700}
tr.batch-sum-row .p-split{color:#7986cb}
td.batch-sum-cell{text-align:center;font-size:15px;font-weight:700;color:#3b5bdb;padding:8px 2px}
.incl-tag{font-size:9px;background:#fff3e0;color:#e65100;border:1px solid #ffcc80;border-radius:4px;padding:1px 5px;margin-left:5px;font-weight:600;white-space:nowrap}
tr.pumper-row td{background:#fff8f0}
tr.pumper-row td.name-cell{background:#fff8f0;color:#e65100;font-weight:500}
tr.pumper-row td.prod-q{color:#e65100;font-weight:600}
/* 다중선택 바 */
.multi-bar{background:#eef2ff;border-bottom:1px solid #c5cae9;padding:8px 14px;display:none;align-items:center;gap:8px;flex-wrap:wrap}
.multi-bar.show{display:flex}
.multi-txt{font-size:12px;color:#3b5bdb;font-weight:600;flex:1;min-width:150px}
.multi-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #3b5bdb;background:#fff;color:#3b5bdb;cursor:pointer;font-family:inherit}
.multi-btn.solid{background:#3b5bdb;color:#fff}
/* 제품 추가 */
.add-row td{padding:0}
.add-inner{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;position:sticky;left:0}
.add-ico{width:24px;height:24px;border-radius:50%;background:#e8eaf6;color:#3b5bdb;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.add-lbl{font-size:12px;color:#3b5bdb;white-space:nowrap}
.add-dtype-btn{margin:12px 14px;padding:11px;border-radius:9px;border:1.5px dashed #3b5bdb;background:#f0f4ff;color:#3b5bdb;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;width:calc(100% - 28px);display:block}
/* 레시피 */
.recipe-card{background:#fff;border-radius:12px;border:1px solid #eee;margin:0 14px 10px;overflow:hidden}
.recipe-hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;cursor:pointer;user-select:none}
.recipe-title{font-size:14px;font-weight:600;color:#111}
.batch-wrap{display:flex;align-items:center;gap:4px;background:#f0f4ff;border-radius:8px;padding:4px 8px}
.batch-lbl{font-size:11px;color:#5566aa}
.batch-inp{width:40px;text-align:center;font-size:13px;font-weight:600;border:none;background:transparent;color:#1a1a2e;font-family:inherit;-moz-appearance:textfield}
.batch-inp::-webkit-inner-spin-button,.batch-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.ing-hdr{display:flex;justify-content:space-between;padding:7px 14px;background:#f8f8f8;font-size:11px;font-weight:600;color:#888;border-bottom:1px solid #f0f0f0}
.ing-row{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #f8f8f8}
.ing-row:nth-child(odd){background:#fafafa}
.ing-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-right:8px}
.ing-n{font-size:13px;color:#333;flex:1}
.ing-pct{font-size:12px;color:#aaa;min-width:52px;text-align:right;margin-right:10px}
.ing-g{font-size:13px;font-weight:600;color:#111;min-width:62px;text-align:right}
.recipe-footer{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid #eee;background:#f9f9f9}
.edit-toggle-btn{font-size:11px;color:#5566aa;background:#eef0ff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit}
.edit-section{padding:12px 14px;background:#fafafa;border-top:1px solid #f0f0f0}
.flour-info{font-size:11px;font-weight:600;color:#888;margin-bottom:10px}
.erow{display:flex;gap:5px;align-items:flex-end;margin-bottom:8px;background:#fff;border-radius:8px;padding:8px 8px;border:1px solid #eee;flex-wrap:nowrap;overflow-x:auto}
.erow::-webkit-scrollbar{display:none}
.ecol{display:flex;flex-direction:column;gap:2px}
.ecol label{font-size:10px;color:#aaa;font-weight:600;white-space:nowrap}
.einp{padding:5px 7px;border-radius:6px;border:1px solid #e0e0e0;font-size:13px;font-family:inherit;background:#fff;width:100%}
.einp:focus{outline:none;border-color:#5566aa}
.einp.ep{color:#5566aa;font-weight:600}
.einp.eg{color:#111;font-weight:600}
.esel{padding:5px 3px;border-radius:6px;border:1px solid #e0e0e0;font-size:12px;font-family:inherit;background:#fff;width:100%;color:#333}
.del-ing-btn{width:28px;height:28px;border-radius:6px;border:none;background:#fee2e2;color:#dc2626;font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;align-self:flex-end}
.add-ing-btn{width:100%;padding:9px;border-radius:8px;border:1.5px dashed #ccc;background:transparent;color:#888;font-size:13px;cursor:pointer;font-family:inherit;margin:4px 0 8px}
.apply-btn{width:100%;padding:10px;border-radius:8px;background:#1a1a2e;color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
/* 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:50;display:none;align-items:flex-end}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:20px 16px;width:100%;max-height:88vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12px;color:#888;margin-bottom:16px}
.modal-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.modal-row label{font-size:12px;font-weight:600;color:#666}
.modal-inp{padding:10px 12px;border-radius:9px;border:1.5px solid #e0e0e0;font-size:15px;font-family:inherit;width:100%}
.modal-inp:focus{outline:none;border-color:#1a1a2e}
.modal-sel{padding:10px 12px;border-radius:9px;border:1.5px solid #e0e0e0;font-size:15px;font-family:inherit;width:100%;background:#fff}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.modal-ok{flex:1;padding:12px;border-radius:10px;background:#1a1a2e;color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.modal-cancel{padding:12px 18px;border-radius:10px;background:#f5f5f5;color:#666;border:none;font-size:15px;cursor:pointer;font-family:inherit}
.modal-del{padding:12px 14px;border-radius:10px;background:#fee2e2;color:#dc2626;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.spacer{height:20px}
/* 계량표 */
.scale-picker{display:flex;gap:6px;padding:10px 14px;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;-webkit-overflow-scrolling:touch}
.scale-picker::-webkit-scrollbar{display:none}
.sc-chip{padding:7px 14px;border-radius:20px;border:1.5px solid #ddd;background:#fff;color:#666;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit}
.sc-chip.on{background:#1a1a2e;border-color:#1a1a2e;color:#fff;font-weight:600}
.sc-round-btn{padding:7px 12px;border-radius:20px;border:1.5px solid #ffcc80;background:#fff;color:#e65100;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;margin-left:auto;font-weight:600}
.sc-round-btn.on{background:#e65100;border-color:#e65100;color:#fff}
tr.sc-fill-note-row td{background:#fff8f0;color:#bf5000;font-size:10px;padding:7px 12px;text-align:center;line-height:1.5}
.base-g{font-size:10px;color:#ffb74d;margin-left:5px;font-weight:500;white-space:nowrap}
.fp-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.fp-name{flex-shrink:0}
.fp-qty{font-size:10px;color:#bf5000;font-weight:600;background:#ffe9d6;border-radius:5px;padding:2px 8px;white-space:nowrap}
.scale-table th.sc-name{min-width:100px}
.scale-table th.sc-col{min-width:66px;padding:7px 4px;line-height:1.3}
.sc-sub{display:block;font-size:9px;color:#aaa;font-weight:400;margin-top:1px}
th.sc-fixed{background:#e8eaf6!important;color:#3b5bdb}
th.sc-fixed .sc-sub{color:#7986cb}
th.sc-custom{background:#fff3e0!important;color:#e65100}
th.sc-custom .sc-sub{color:#ffb74d}
td.sc-cell{text-align:center;font-size:13px;padding:7px 3px;color:#333;font-weight:500}
td.sc-fixed{background:#f5f6ff;color:#3b5bdb;font-weight:600}
tr:nth-child(even) td.sc-fixed{background:#eef0ff}
td.sc-custom{background:#fffaf5;color:#e65100;font-weight:600}
tr:nth-child(even) td.sc-custom{background:#fff5eb}
td.sc-name-cell{font-size:13px;color:#333;padding:7px 12px;display:flex;align-items:center;gap:6px}
.sc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
tr.sc-stage td{background:#1a1a2e;color:#fff;font-size:11px;font-weight:700;padding:7px 12px;letter-spacing:.06em;position:sticky;left:0}
tr.sc-subtotal td{background:#f0f2f5;font-weight:700;font-size:13px;text-align:center;padding:8px 3px;color:#555;border-top:1px solid #ddd}
tr.sc-subtotal td.name-cell{background:#f0f2f5;text-align:left;padding-left:12px;font-size:12px}
tr.sc-total td{background:#1a1a2e;color:#fff;font-weight:700;font-size:14px;text-align:center;padding:10px 3px}
tr.sc-total td.name-cell{background:#1a1a2e;text-align:left;padding-left:12px;font-size:13px}
.sc-input-bar{display:flex;align-items:center;gap:10px;padding:14px;background:#fff;border-top:1px solid #eee;flex-wrap:wrap}
.sc-input-lbl{font-size:13px;color:#666;font-weight:600}
.sc-input{width:80px;padding:9px 12px;border-radius:9px;border:1.5px solid #ffcc80;background:#fffaf5;font-size:16px;font-weight:700;color:#e65100;text-align:center;font-family:inherit;-moz-appearance:textfield}
.sc-input::-webkit-inner-spin-button,.sc-input::-webkit-outer-spin-button{-webkit-appearance:none}
.sc-input:focus{outline:none;border-color:#e65100}
.sc-input-hint{font-size:11px;color:#aaa}
.stage-inp{color:#7986cb!important;background:#f8f9ff!important}
.max-tag{font-size:9px;background:#e8f5e9;color:#1a6b3c;border:1px solid #a5d6a7;border-radius:4px;padding:1px 5px;margin-left:5px;font-weight:600;white-space:nowrap}
.split-hint{display:block;font-size:10px;color:#1a6b3c;font-weight:600;margin-top:1px}
.split-txt{color:#1a6b3c;font-weight:700;font-size:12px}
tr.maxb-row td{background:#f1f8f4}
tr.maxb-row td.name-cell{background:#f1f8f4;color:#1a6b3c}
.maxb-inp{border-color:#a5d6a7!important;color:#1a6b3c!important}
th.sc-split{background:#e8f5e9!important;color:#1a6b3c}
th.sc-split .sc-sub{color:#66bb6a}

// ── Firebase ──
function loadSaved(){
  document.getElementById('saveTime').textContent='불러오는 중...';
  fetch(FIREBASE_URL+'/bakery.json').then(r=>r.json()).then(p=>{
    if(p&&p.products){ PRODUCTS=p.products; }
    if(p&&p.dtypes) DTYPES=p.dtypes;
    PRODUCTS.forEach(initQty);
    if(p&&p.allQty) DAYS.forEach(d=>{ if(p.allQty[d]) Object.keys(p.allQty[d]).forEach(k=>{ if(!allQty[d]) allQty[d]={}; allQty[d][k]=p.allQty[d][k]; }); });
    if(p&&p.recipes){
      // 서버 레시피 로드 후 stage 필드 보정 (재료명에 '풀리쉬'가 있으면 자동 분류)
      Object.keys(p.recipes).forEach(k=>{
        const r=p.recipes[k];
        if(!r.ings) return;
        const hasStage=r.ings.some(i=>i.stage);
        if(!hasStage){
          r.ings.forEach(i=>{
            if(/풀리쉬|폴리쉬|poolish/i.test(i.n)){
              i.stage='풀리쉬';
              i.n=i.n.replace(/\s*\(?(풀리쉬|폴리쉬|poolish)\)?\s*/gi,'').trim()||i.n;
            } else if(/본반죽/i.test(i.n)){
              i.stage='본반죽';
              i.n=i.n.replace(/\s*\(?본반죽\)?\s*/g,'').trim()||i.n;
            }
          });
          // 풀리쉬가 하나라도 있으면 나머지는 본반죽으로
          if(r.ings.some(i=>i.stage==='풀리쉬')){
            r.ings.forEach(i=>{ if(!i.stage) i.stage='본반죽'; });
          }
        }
      });
      RECIPES=p.recipes;
    }
    if(p&&p.recipeTotals) RECIPE_TOTALS={...RECIPE_TOTALS,...p.recipeTotals};
    if(p&&p.offsets) OFFSETS=p.offsets;
    if(p&&p.batchMode) BATCH_MODE=p.batchMode;
    if(p&&p.grouped) GROUPED=p.grouped;
    if(p&&p.maxBatch) MAXBATCH=p.maxBatch;
    if(p&&p.fillings) FILLINGS=p.fillings;
    if(p&&p.batchQty) DAYS.forEach(d=>{ if(p.batchQty[d]) batchQty[d]={...batchQty[d],...p.batchQty[d]}; });
    const t=localStorage.getItem('bakery_savetime');
    document.getElementById('saveTime').textContent=t||'--';
    renderQtyTable();
  }).catch(()=>{ document.getElementById('saveTime').textContent='오프라인'; renderQtyTable(); });
}
function saveData(){
  const now=new Date(); const str=`${now.getMonth()+1}/${now.getDate()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  document.getElementById('saveTime').textContent='저장 중...';
  fetch(FIREBASE_URL+'/bakery.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({allQty,recipes:RECIPES,recipeTotals:RECIPE_TOTALS,products:PRODUCTS,dtypes:DTYPES,offsets:OFFSETS,batchMode:BATCH_MODE,batchQty,grouped:GROUPED,maxBatch:MAXBATCH,fillings:FILLINGS,levain:LEVAIN})})
    .then(()=>{ localStorage.setItem('bakery_savetime',str); document.getElementById('saveTime').textContent=str; showToast('저장했습니다'); })
    .catch(()=>showToast('저장 실패'));
}
function pad(n){ return String(n).padStart(2,'0'); }
function showToast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// ── 수량 테이블 ──
// 분할 중량 표기: 총 500g (반죽 400 + 충전 100)
function splitLabel(p){
  const fp=fillPerPc(p.name);
  if(fp<=0) return `${p.split}g`;
  const dough=Math.max(0,p.split-fp);
  return `<b class="sl-total">${p.split}g</b> <span class="sl-detail">(반죽 ${fmtG(dough)} + 충전 ${fmtG(fp)})</span>`;
}

function renderQtyTable(){
  const wrap=document.getElementById('qtyWrap');
  let rowCounter=0;
  let h='<table><thead><tr><th class="name-col">제품 (분할g)</th>';
  DAYS.forEach(d=>{
    const wk=(d==='토'||d==='일')?' weekend':'';
    const sel=selDays.includes(d)?' sel':'';
    h+=`<th class="day-col${wk}${sel}" onclick="toggleDay('${d}')">${d}</th>`;
  });
  h+='</tr></thead><tbody>';
  DTYPES.forEach(dtype=>{
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const isBatch=BATCH_MODE[dtype];
    const dti=DTYPES.indexOf(dtype);
    const dtArrows=sortMode?`<span class="arrows dt-arrows"><button class="ar-btn dt-ar" ${dti===0?'disabled':''} onclick="moveDtype(${dti},-1)">&#9650;</button><button class="ar-btn dt-ar" ${dti===DTYPES.length-1?'disabled':''} onclick="moveDtype(${dti},1)">&#9660;</button></span>`:'';
    h+=`<tr class="sec-row"><td colspan="${DAYS.length+1}"><div class="sec-inner"><span class="sec-name">${dtArrows}${dtype}${isBatch?' <span class="batch-tag">배합수 입력</span>':''}</span><div style="display:flex;gap:5px">${sortMode?'':`<button class="sec-mode" onclick="toggleBatchMode('${dtype}')">${isBatch?'개수로':'배합수로'}</button><button class="sec-del" onclick="delDtype('${dtype}')">삭제</button>`}</div></div></td></tr>`;

    // 배합수 직접입력 모드 — 제품별 배합수 입력
    if(isBatch){
      prods.forEach(p=>{
        const rowIdx=rowCounter++;
        const esc=p.name.replace(/"/g,'&quot;');
        const bi=prods.indexOf(p);
        const barrows=sortMode?`<span class="arrows" onclick="event.stopPropagation()"><button class="ar-btn" ${bi===0?'disabled':''} onclick="moveProd('${dtype}',${bi},-1)">&#9650;</button><button class="ar-btn" ${bi===prods.length-1?'disabled':''} onclick="moveProd('${dtype}',${bi},1)">&#9660;</button></span>`:'';
        h+=`<tr class="batch-input-row" data-pname="${esc}" data-dtype="${dtype}"><td class="name-cell" onclick="${sortMode?'':`openEditProd('${p.name.replace(/'/g,"\\'")}')`}"><div class="p-name">${barrows}${p.name}</div><div class="p-split">${splitLabel(p)} · 배합수</div></td>`;
        DAYS.forEach((d,di)=>{
          const v=batchQty[d]?.[p.name]??0;
          const zc=v===0?' zero':'';
          const sc=selDays.includes(d)?' sel-day':'';
          h+=`<td class="qty-cell"><input class="q-inp batch-inp-cell${zc}${sc}" type="number" min="0" step="0.1" value="${v}" data-day="${d}" data-col="${di}" data-row="${rowIdx}" data-name="${p.name.replace(/"/g,'&quot;')}" oninput="onBatchQty(this)" onkeydown="onCellKey(event,this)"></td>`;
        });
        h+='</tr>';
      });
      // 반죽 합계 행
      h+=`<tr class="batch-sum-row"><td class="name-cell" style="cursor:default"><div class="p-name">${dtype} 합계</div><div class="p-split">자동 합산</div></td>`;
      DAYS.forEach(d=>{
        const sum=prods.reduce((s,p)=>s+(batchQty[d]?.[p.name]||0),0);
        h+=`<td class="batch-sum-cell">${sum>0?sum.toFixed(1):'<span style="color:#ddd">-</span>'}</td>`;
      });
      h+='</tr>';
      h+=`<tr class="add-row"><td colspan="${DAYS.length+1}"><div class="add-inner" onclick="openAddProd('${dtype}')"><div class="add-ico">+</div><span class="add-lbl">${dtype} 제품 추가</span></div></td></tr>`;
      return;
    }

    prods.forEach(p=>{
      const rowIdx=rowCounter++;
      const esc=p.name.replace(/"/g,'&quot;');
      const gg=GROUPED[p.name];
      const gTag=gg&&gg.days?.length?`<span class="grp-tag">${gg.weighDay}에 ${gg.days.join('+')}</span>`:'';
      const pi=prods.indexOf(p);
      const arrows=sortMode?`<span class="arrows" onclick="event.stopPropagation()"><button class="ar-btn" ${pi===0?'disabled':''} onclick="moveProd('${dtype}',${pi},-1)">&#9650;</button><button class="ar-btn" ${pi===prods.length-1?'disabled':''} onclick="moveProd('${dtype}',${pi},1)">&#9660;</button></span>`:'';
      h+=`<tr data-pname="${esc}" data-dtype="${dtype}"><td class="name-cell" onclick="${sortMode?'':`openEditProd('${p.name.replace(/'/g,"\\'")}')`}"><div class="p-name">${arrows}${p.name}</div><div class="p-split">${splitLabel(p)}${gTag}</div></td>`;
      DAYS.forEach((d,di)=>{
        const v=allQty[d]?.[p.name]??0;
        const zc=v===0?' zero':'';
        const sc=selDays.includes(d)?' sel-day':'';
        h+=`<td class="qty-cell"><input class="q-inp${zc}${sc}" type="number" min="0" value="${v}" data-day="${d}" data-col="${di}" data-row="${rowIdx}" data-name="${p.name.replace(/"/g,'&quot;')}" oninput="onQty(this)" onkeydown="onCellKey(event,this)"></td>`;
      });
      h+='</tr>';
    });
    h+=`<tr class="add-row"><td colspan="${DAYS.length+1}"><div class="add-inner" onclick="openAddProd('${dtype}')"><div class="add-ico">+</div><span class="add-lbl">${dtype} 제품 추가</span></div></td></tr>`;
  });
  h+='</tbody></table>';
  wrap.innerHTML=h;
}

// ── 순서 변경 ──
function toggleSortMode(){
  sortMode=!sortMode;
  const btn=document.getElementById('sortBtn');
  btn.textContent=sortMode?'완료':'순서 변경';
  btn.classList.toggle('on',sortMode);
  renderQtyTable();
  if(sortMode) showToast('반죽·제품 화살표로 순서를 바꾸세요');
}

function moveDtype(idx,dir){
  const j=idx+dir;
  if(j<0||j>=DTYPES.length) return;
  const t=DTYPES[idx]; DTYPES[idx]=DTYPES[j]; DTYPES[j]=t;
  renderQtyTable();
}

function moveProd(dtype,idx,dir){
  const prods=PRODUCTS.filter(p=>p.dtype===dtype);
  const j=idx+dir;
  if(j<0||j>=prods.length) return;
  // 해당 dtype 내에서 두 제품 위치 교환
  const a=prods[idx], b=prods[j];
  const ia=PRODUCTS.indexOf(a), ib=PRODUCTS.indexOf(b);
  PRODUCTS[ia]=b; PRODUCTS[ib]=a;
  renderQtyTable();
}

function onQty(el){
  const day=el.dataset.day, name=el.dataset.name;
  const val=Math.max(0,parseInt(el.value)||0);
  if(selDays.length>0 && selDays.includes(day)){
    // 선택된 모든 요일에 적용
    selDays.forEach(d=>{ if(allQty[d]) allQty[d][name]=val; });
    // 화면의 같은 제품 다른 선택요일 셀도 업데이트
    document.querySelectorAll(`.q-inp[data-name="${CSS.escape(name)}"]`).forEach(inp=>{
      if(selDays.includes(inp.dataset.day)&&inp!==el){ inp.value=val; inp.classList.toggle('zero',val===0); }
    });
  } else {
    allQty[day][name]=val;
  }
  el.classList.toggle('zero',val===0);
  if(curTab==='result') renderResultTable();
}

function onBatchQty(el){
  const day=el.dataset.day, name=el.dataset.name;
  const val=Math.max(0,parseFloat(el.value)||0);
  if(selDays.length>0 && selDays.includes(day)){
    selDays.forEach(d=>{ if(!batchQty[d]) batchQty[d]={}; batchQty[d][name]=val; });
    document.querySelectorAll(`.batch-inp-cell[data-name="${CSS.escape(name)}"]`).forEach(inp=>{
      if(selDays.includes(inp.dataset.day)&&inp!==el){ inp.value=val; inp.classList.toggle('zero',val===0); }
    });
  } else {
    if(!batchQty[day]) batchQty[day]={};
    batchQty[day][name]=val;
  }
  el.classList.toggle('zero',val===0);
  updateBatchSums();
  if(curTab==='result') renderResultTable();
}

// 배합수 모드 반죽의 합계 행 갱신
function updateBatchSums(){
  DTYPES.forEach(dtype=>{
    if(!BATCH_MODE[dtype]) return;
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const rows=document.querySelectorAll('.batch-sum-row');
    rows.forEach(row=>{
      const lbl=row.querySelector('.p-name')?.textContent||'';
      if(lbl!==dtype+' 합계') return;
      const cells=row.querySelectorAll('.batch-sum-cell');
      DAYS.forEach((d,i)=>{
        const sum=prods.reduce((s,p)=>s+(batchQty[d]?.[p.name]||0),0);
        if(cells[i]) cells[i].innerHTML=sum>0?sum.toFixed(1):'<span style="color:#ddd">-</span>';
      });
    });
  });
}

function toggleBatchMode(dtype){
  BATCH_MODE[dtype]=!BATCH_MODE[dtype];
  renderQtyTable();
  showToast(BATCH_MODE[dtype]?`'${dtype}' 배합수 직접 입력 모드`:`'${dtype}' 개수 입력 모드`);
}

// Tab/Enter → 같은 요일의 다음 제품(아래)으로 이동
function onCellKey(e,el){
  if(e.key!=='Tab'&&e.key!=='Enter') return;
  e.preventDefault();
  const col=el.dataset.col, row=parseInt(el.dataset.row);
  const dir=e.shiftKey?-1:1;
  const next=document.querySelector(`.q-inp[data-col="${col}"][data-row="${row+dir}"]`);
  if(next){ next.focus(); next.select(); }
  else {
    // 끝이면 다음/이전 요일 첫 행으로
    const nc=parseInt(col)+dir;

// ── 배합수 테이블 ──
// 계량일(day)에서 offset일 후의 판매 요일 반환
function saleDay(day,offset){
  const i=DAYS.indexOf(day);
  return DAYS[(i+(offset||0))%7];
}

// 제품 p의 판매일 수량 (계량일 day 기준)
function qtyFor(p,day){
  const g=GROUPED[p.name];
  if(g&&g.days&&g.days.length){
    // 묶음 계량: 지정 요일에 몰아서 계량
    if(day===g.weighDay){
      return g.days.reduce((s,sd)=>s+((allQty[sd]||{})[p.name]||0),0);
    }
    // 묶인 판매일을 담당하던 계량일이면 0
    const off=OFFSETS[p.name]||0;
    const sd=saleDay(day,off);
    if(g.days.includes(sd)) return 0;
  }
  const off=OFFSETS[p.name]||0;
  return (allQty[saleDay(day,off)]||{})[p.name]||0;
}

function calcBatchesFor(day){
  const result={};
  // 의존 순서: 펌퍼니클 → 잡곡식빵 → 식빵(묵반) 순으로 계산
  const LAST=['잡곡식빵','식빵'];
  const order=[...DTYPES.filter(d=>!LAST.includes(d)),...LAST.filter(d=>DTYPES.includes(d))];
  order.forEach(dtype=>{
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const recipe=RECIPE_TOTALS[dtype]; if(!recipe||!prods.length) return;
    let batches,total_g;
    // 배합수 직접입력 모드 — 제품별 배합수를 각자의 오프셋으로 합산
    if(BATCH_MODE[dtype]){
      batches=prods.reduce((s,p)=>{
        const g=GROUPED[p.name];
        if(g&&g.days&&g.days.length){
          if(day===g.weighDay) return s+g.days.reduce((a,sd)=>a+(batchQty[sd]?.[p.name]||0),0);
          const off0=OFFSETS[p.name]||0;
          if(g.days.includes(saleDay(day,off0))) return s;
        }
        const off=OFFSETS[p.name]||0;
        return s+(batchQty[saleDay(day,off)]?.[p.name]||0);
      },0);
      batches=Math.round(batches*10)/10;
      total_g=batches*recipe;
      result[dtype]={batches,total_g,direct:true};
      return;
    }
    if(dtype==='식빵'){
      // 소금빵 + 초코모닝빵 + 다른 반죽에 들어가는 묵반 소요량
      const ownG=prods.reduce((s,p)=>s+qtyFor(p,day)*p.split,0);
      const mukbanUsers=['탕종식빵','모카빵','잡곡모닝','잡곡식빵'];
      const mukbanB=mukbanUsers.reduce((s,dt)=>s+(result[dt]?.batches||0),0);
      const need=ownG+mukbanB*MUKBAN;
      batches=need>0?Math.ceil(need/(SIK_TOTAL-MUKBAN)*10)/10:0;
      total_g=batches*(SIK_TOTAL-MUKBAN);
    } else if(dtype==='잡곡식빵'){
      // 잡곡식빵 자체 + 펌퍼니클이 쓰는 잡곡식빵 반죽(1배합당 1,100g)
      const ownG=prods.reduce((s,p)=>s+qtyFor(p,day)*p.split,0);
      const pumperB=result['펌퍼니클']?.batches||0;
      const pumperG=pumperB*PUMPER_JAPGOK;
      const need=ownG+pumperG;
      batches=need>0?Math.ceil(need/recipe*10)/10:0;
      total_g=need;
      result[dtype]={batches,total_g,pumperG,ownG};
      return;
    } else {
      total_g=prods.reduce((s,p)=>s+qtyFor(p,day)*p.split,0);
      batches=total_g>0?Math.ceil(total_g/recipe*10)/10:0;
    }
    result[dtype]={batches,total_g};
  });
  return result;
}

let expandedDtypes={};  // 반죽별 제품 목록 펼침 상태

    DAYS.forEach(d=>{

    h+='</tr>';
    // 최대 배합수 설정 행 (펼침 시)

      h+=`<tr class="prod-off-row maxb-row"><td class="name-cell prod-sub-cell">1회 최대 배합수<span class="prod-g">초과 시 자동 분할</span></td>`;
      h+=`<td class="off-cell"><input class="off-inp maxb-inp" type="number" min="0" step="0.5" value="${mx||''}" placeholder="-" data-dtype="${dtype}" oninput="onMaxBatch(this)"><span class="off-hint">${mx?'배합':'무제한'}</span></td>`;
      DAYS.forEach(d=>{
        const b=byDay[d][dtype]?.batches||0;
        const parts=splitBatch(b,mx);
        h+=`<td class="prod-q">${b>0&&mx&&b>mx?`<span class="split-txt">${parts.join(' + ')}</span>`:'<span style="color:#ddd">-</span>'}</td>`;
      });
      h+='</tr>';
    }
    // 제품별 생산일 입력 행 (펼쳐진 경우)
    if(isOpen){
      if(BATCH_MODE[dtype]){
        prods.forEach(p=>{
          const off=OFFSETS[p.name]||0;
          h+=`<tr class="prod-off-row"><td class="name-cell prod-sub-cell">${p.name}<span class="prod-g">배합수</span></td>`;
          h+=`<td class="off-cell"><input class="off-inp" type="number" min="0" max="6" value="${off}" data-pname="${p.name.replace(/"/g,'&quot;')}" oninput="onOffset(this)"><span class="off-hint">${off===0?'당일':'+'+off}</span></td>`;
          DAYS.forEach(d=>{
            const sd=saleDay(d,off);
            const b=batchQty[sd]?.[p.name]||0;
            h+=`<td class="prod-q">${b>0?b.toFixed(1):'<span style="color:#ddd">-</span>'}<span class="sale-day">${sd}</span></td>`;
          });
          h+='</tr>';
        });
      } else {
      // 잡곡식빵: 펌퍼니클 소요량 안내 행
      if(dtype==='잡곡식빵'){
        h+=`<tr class="prod-off-row pumper-row"><td class="name-cell prod-sub-cell">↳ 펌퍼니클용<span class="prod-g">1배합당 ${PUMPER_JAPGOK.toLocaleString()}g</span></td><td class="off-cell"><span class="off-summary" style="font-size:10px">자동</span></td>`;
        DAYS.forEach(d=>{
          const pg=byDay[d]['잡곡식빵']?.pumperG||0;
          h+=`<td class="prod-q">${pg>0?Math.round(pg).toLocaleString()+'g':'<span style="color:#ddd">-</span>'}</td>`;
        });
        h+='</tr>';
      }
      prods.forEach(p=>{
        const off=OFFSETS[p.name]||0;
        h+=`<tr class="prod-off-row"><td class="name-cell prod-sub-cell">${p.name}<span class="prod-g">${splitLabel(p)}</span></td>`;
        h+=`<td class="off-cell"><input class="off-inp" type="number" min="0" max="6" value="${off}" data-pname="${p.name.replace(/"/g,'&quot;')}" oninput="onOffset(this)"><span class="off-hint">${off===0?'당일':'+'+off}</span></td>`;
        DAYS.forEach(d=>{
          const sd=saleDay(d,off);
          const q=(allQty[sd]||{})[p.name]||0;
          h+=`<td class="prod-q">${q>0?q:'<span style="color:#ddd">-</span>'}<span class="sale-day">${sd}</span></td>`;
        });
        h+='</tr>';
      });
      }
    }
  });

  h+='<tr class="batch-row total-row"><td class="name-cell">합계</td><td class="off-cell"></td>';
  DAYS.forEach(d=>{ h+=`<td>${totals[d].toFixed(1)}</td>`; });
  h+='</tr></tbody></table>';
  h+='<div class="off-guide"><b>반죽 이름을 탭하면</b> 제품별 생산일을 설정할 수 있습니다.<br>생산일 0=계량 당일 판매, 1=다음 날, 2=이틀 뒤 &nbsp;|&nbsp; 배합수는 <b>계량하는 날</b> 기준입니다.</div>';
  wrap.innerHTML=h;
}

// 반죽 내 제품들의 오프셋 요약 표시
function mixedOffsetLabel(prods){
  const offs=[...new Set(prods.map(p=>OFFSETS[p.name]||0))];
  if(offs.length===1) return `<span class="off-summary">${offs[0]===0?'당일':'+'+offs[0]+'일'}</span>`;
  return `<span class="off-summary mixed">혼합</span>`;
}

function toggleDtypeProds(dtype){
  expandedDtypes[dtype]=!expandedDtypes[dtype];
  renderResultTable();
}

function onMaxBatch(el){
  const dtype=el.dataset.dtype;
  const v=Math.max(0,parseFloat(el.value)||0);
  if(v) MAXBATCH[dtype]=v; else delete MAXBATCH[dtype];
  renderResultTable();
}

function onOffset(el){
  const v=Math.max(0,Math.min(6,parseInt(el.value)||0));
  const bd=el.dataset.batchdtype;
  if(bd){
    // 배합수 모드: 소속 제품 전체에 동일 적용
    PRODUCTS.filter(p=>p.dtype===bd).forEach(p=>{ OFFSETS[p.name]=v; });
  } else {
    OFFSETS[el.dataset.pname]=v;
  }
  renderResultTable();
}

  const oldName=modalData.oldName;
  const newName=document.getElementById('mi-pname')?.value?.trim();
  const split=parseFloat(document.getElementById('mi-split')?.value)||0;
  const wd=parseInt(document.getElementById('mi-wd')?.value)||0;

  if(!newName||!split){ showToast('제품명과 중량을 입력하세요'); return; }
  const p=PRODUCTS.find(x=>x.name===oldName); if(!p) return;

  // 소속 반죽 결정
  let newDtype=document.getElementById('mi-dtype-sel')?.value||p.dtype;
  if(newDtype==='__new__'){
    const nd=document.getElementById('mi-newdtype')?.value?.trim();
    if(!nd){ showToast('새 반죽 이름을 입력하세요'); return; }
    if(!DTYPES.includes(nd)){
      DTYPES.push(nd);
      // 레시피가 없으면 원래 반죽 레시피를 복제해서 시작
      if(!RECIPES[nd]&&RECIPES[p.dtype]){
        RECIPES[nd]=JSON.parse(JSON.stringify(RECIPES[p.dtype]));
        RECIPES[nd].label=nd;
      }
      if(!RECIPE_TOTALS[nd]) RECIPE_TOTALS[nd]=RECIPE_TOTALS[p.dtype]||(RECIPES[nd]?RECIPES[nd].total:0);
    }
    newDtype=nd;
  }

  // 이름 변경 시 수량 키 이동
  if(newName!==oldName){
    DAYS.forEach(d=>{
      if(allQty[d]){ allQty[d][newName]=allQty[d][oldName]; delete allQty[d][oldName]; }
      if(batchQty[d]&&batchQty[d][oldName]!==undefined){ batchQty[d][newName]=batchQty[d][oldName]; delete batchQty[d][oldName]; }
    });

function fillPerPc(pname){
  return (FILLINGS[pname]||[])
    .filter(f=>(f.per||'pc')==='pc')
    .reduce((s,f)=>s+f.g,0);
}

// 반죽 총량 기준 충전물 총량 계산
function fillTotalFor(key,doughTot,batch){
  let tot=0;
  prodsOf(key).forEach(p=>{
    const fl=FILLINGS[p.name]||[];
    if(!fl.length) return;
    const fpc=fillPerPc(p.name);
    const doughPer=Math.max(1,p.split-fpc);   // 1개당 순수 반죽량
    const pcs=doughPer>0?(doughTot/doughPer):0;
    fl.forEach(f=>{
      if((f.per||'pc')==='pc') tot+=f.g*pcs;
      else tot+=f.g*batch;
    });
  });
  return tot;
}

// 배합수를 최대치 기준으로 분할
// 예) 14.4배합, max 8 → 올림 15 → 2통 → [8,7]
function splitBatch(batches,max,roundUp){
  if(!batches||batches<=0) return [];
  const up=(roundUp===undefined)?true:roundUp;
  const rounded=up?Math.ceil(batches):Math.round(batches*10)/10;
  if(!max||max<=0||rounded<=max) return [rounded];
  if(!up){
    // 올림 미적용: 균등 분할 (소수 유지)
    const n=Math.ceil(rounded/max);
    const each=Math.round(rounded/n*10)/10;
    return Array(n).fill(each);
  }
  const n=Math.ceil(rounded/max);            // 통 개수
  const base=Math.floor(rounded/n);          // 기본 배합
  const rem=rounded-base*n;                  // 나머지
  const out=[];
  for(let i=0;i<n;i++) out.push(base+(i<rem?1:0));
  return out.sort((a,b)=>b-a);               // 큰 것부터
}

function levainNeedFor(day){
  // 그 날 계량하는 반죽들이 쓰는 르방 총량(g)
  const byDay=calcBatchesFor(day);
  let total=0; const detail=[];
  (LEVAIN.users||[]).forEach(u=>{
    const b=byDay[u.dtype]?.batches||0;
    const g=b*u.gPerBatch;
    if(g>0) detail.push({dtype:u.dtype,batches:b,g});
    total+=g;
  });
  return {total,detail};
}

    DAYS.forEach(d=>{
      const bd=calcBatchesFor(d);
      const b=bd[u.dtype]?.batches||0;
      h+=`<td>${b>0?Math.round(b*u.gPerBatch).toLocaleString():'<span style="color:#ddd">-</span>'}</td>`;
    });
    h+='</tr>';
  });

  // 필요량 + 손실
  h+='<tr class="lv-need-row"><td class="name-cell">필요량 합계</td>';
  const needs={};
  DAYS.forEach(d=>{
    const n=levainNeedFor(d).total;
    needs[d]=n;
    h+=`<td>${n>0?Math.round(n).toLocaleString():'<span style="color:#ddd">-</span>'}</td>`;
  });
  h+='</tr>';

  h+=`<tr class="lv-loss-row"><td class="name-cell">+ 손실 ${LEVAIN.loss??5}%</td>`;
  const targets={};
  DAYS.forEach(d=>{
    const t=needs[d]*(1+loss);
    targets[d]=t;
    h+=`<td>${t>0?Math.round(t).toLocaleString():'<span style="color:#ddd">-</span>'}</td>`;
  });
  h+='</tr>';

  // ── 아침 리프레쉬 ──
  h+=`<tr class="lv-stage"><td colspan="${DAYS.length+1}">아침 리프레쉬 &nbsp;(초종 ${M.seed} : 물 ${M.water} : T65 ${M.t65} : 호밀 ${M.rye})</td></tr>`;
  const mSeed={};
  [['초종','seed'],['물','water'],['T65','t65'],['호밀','rye']].forEach(([lbl,k])=>{
    h+=`<tr class="lv-ing"><td class="name-cell">${lbl}</td>`;
    DAYS.forEach(d=>{
      const v=targets[d]/mSum*M[k];
      if(k==='seed') mSeed[d]=v;
      h+=`<td>${v>0?fmtG(v):'<span style="color:#ddd">-</span>'}</td>`;
    });
    h+='</tr>';
  });
  h+='<tr class="lv-subtotal"><td class="name-cell">아침 결과물</td>';
  DAYS.forEach(d=>{ h+=`<td>${targets[d]>0?Math.round(targets[d]).toLocaleString():'<span style="color:#ddd">-</span>'}</td>`; });
  h+='</tr>';

  // ── 저녁 리프레쉬 (전날 저녁 = 아침 초종을 만드는 단계) ──
  h+=`<tr class="lv-stage ev"><td colspan="${DAYS.length+1}">저녁 리프레쉬 &nbsp;(초종 ${E.seed} : 물 ${E.water} : T65 ${E.t65} : 호밀 ${E.rye}) — <b>전날 저녁</b>에 진행</td></tr>`;
  // 저녁 결과물 = 다음날 아침의 초종량
  const evTarget={};
  DAYS.forEach((d,i)=>{
    const next=DAYS[(i+1)%7];
    evTarget[d]=mSeed[next]||0;
  });
  [['초종','seed'],['물','water'],['T65','t65'],['호밀','rye']].forEach(([lbl,k])=>{
    h+=`<tr class="lv-ing ev"><td class="name-cell">${lbl}</td>`;
    DAYS.forEach(d=>{
      const v=evTarget[d]/eSum*E[k];
      h+=`<td>${v>0?fmtG(v):'<span style="color:#ddd">-</span>'}</td>`;
    });
    h+='</tr>';
  });
  h+='<tr class="lv-subtotal ev"><td class="name-cell">저녁 결과물</td>';
  DAYS.forEach(d=>{ h+=`<td>${evTarget[d]>0?fmtG(evTarget[d]):'<span style="color:#ddd">-</span>'}</td>`; });
  h+='</tr>';

  h+='</tbody></table></div>';

  // 설정
  h+=`<div class="lv-settings">
    <div class="lv-set-title">설정</div>
    <div class="lv-set-row"><label>손실률 (%)</label><input class="lv-inp" type="number" min="0" step="0.5" value="${LEVAIN.loss??5}" oninput="LEVAIN.loss=parseFloat(this.value)||0;renderLevain()"></div>
    <div class="lv-set-title" style="margin-top:14px">아침 리프레쉬 비율</div>
    <div class="lv-ratio">
      ${['seed','water','t65','rye'].map((k,i)=>`<div class="lv-r"><label>${['초종','물','T65','호밀'][i]}</label><input class="lv-inp" type="number" min="0" step="0.1" value="${M[k]}" oninput="LEVAIN.morning.${k}=parseFloat(this.value)||0;renderLevain()"></div>`).join('')}
    </div>
    <div class="lv-set-title" style="margin-top:14px">저녁 리프레쉬 비율</div>
    <div class="lv-ratio">
      ${['seed','water','t65','rye'].map((k,i)=>`<div class="lv-r"><label>${['초종','물','T65','호밀'][i]}</label><input class="lv-inp" type="number" min="0" step="1" value="${E[k]}" oninput="LEVAIN.evening.${k}=parseFloat(this.value)||0;renderLevain()"></div>`).join('')}
    </div>
    <div class="lv-set-title" style="margin-top:14px">르방 사용 반죽</div>
    <div id="lv-users">${(LEVAIN.users||[]).map((u,i)=>`
      <div class="lv-user">
        <select class="lv-sel" onchange="LEVAIN.users[${i}].dtype=this.value;renderLevain()">
          ${DTYPES.map(dt=>`<option value="${dt}" ${dt===u.dtype?'selected':''}>${dt}</option>`).join('')}
        </select>
        <input class="lv-inp" type="number" min="0" value="${u.gPerBatch}" oninput="LEVAIN.users[${i}].gPerBatch=parseFloat(this.value)||0;renderLevain()">
        <span class="lv-unit">g/배합</span>
        <button class="lv-del" onclick="LEVAIN.users.splice(${i},1);renderLevain()">&#215;</button>
      </div>`).join('')}
    </div>
    <button class="lv-add" onclick="LEVAIN.users.push({dtype:DTYPES[0],gPerBatch:100});renderLevain()">+ 사용 반죽 추가</button>
  </div>`;

  body.innerHTML=h;
}

// ══════════════════════════════════════════
// 계량표 탭
// ══════════════════════════════════════════
let scaleDtype=null;   // 선택된 반죽
let scaleCustom=1;     // 직접 입력 배합수
let scaleRoundUp=true; // 배합수 올림 적용 여부

function renderScale(){
  const picker=document.getElementById('scalePicker');
  const avail=DTYPES.filter(dt=>RECIPES[dt]&&RECIPES[dt].ings?.length);
  if(!scaleDtype||!avail.includes(scaleDtype)) scaleDtype=avail[0]||null;

  picker.innerHTML=(avail.map(dt=>
    `<button class="sc-chip ${dt===scaleDtype?'on':''}" onclick="pickScale('${dt}')">${dt}</button>`
  ).join('')||'<div style="padding:20px;color:#bbb;font-size:13px">레시피가 등록된 반죽이 없습니다</div>')
  +`<button class="sc-round-btn ${scaleRoundUp?'on':''}" onclick="toggleRoundUp()">${scaleRoundUp?'올림 ON':'올림 OFF'}</button>`;

  renderScaleTable();
}

function pickScale(dt){ scaleDtype=dt; renderScale(); }
function toggleRoundUp(){ scaleRoundUp=!scaleRoundUp; renderScale(); showToast(scaleRoundUp?'배합수 올림 적용':'실제 배합수로 표시'); }

function renderScaleTable(){
  const wrap=document.getElementById('scaleWrap');
  if(!scaleDtype||!RECIPES[scaleDtype]){ wrap.innerHTML=''; return; }
  const rec=RECIPES[scaleDtype];

  // 요일별 배합수 (0 제외, 중복 제거)
  const byDay={}; DAYS.forEach(d=>byDay[d]=calcBatchesFor(d));
  const dayBatch=DAYS.map(d=>({day:d,b:byDay[d][scaleDtype]?.batches||0})).filter(x=>x.b>0);

  // 열 구성: 1배합 고정 + 요일별 배합수 + 직접입력
  const mx=MAXBATCH[scaleDtype]||0;
  const cols=[{label:'1배합',sub:'기준',mult:1,fixed:true}];

  // 필요한 배합 단위를 모두 수집 (분할 포함) → 낮은 것부터 정렬
  const unitMap=new Map();  // key: 배합수, val: {mult, days:Set}
  dayBatch.forEach(x=>{
    const parts=splitBatch(x.b,mx,scaleRoundUp);
    parts.forEach(pb=>{
      const k=pb.toString();
      if(!unitMap.has(k)) unitMap.set(k,{mult:pb,days:new Set()});
      unitMap.get(k).days.add(x.day);
    });
  });
  const units=[...unitMap.values()].sort((a,b)=>a.mult-b.mult);
  units.forEach(u=>{
    const ds=[...u.days];
    const dayLbl=ds.length>3?`${ds[0]}외 ${ds.length-1}일`:ds.join('·');
    cols.push({label:`${u.mult}배합`,sub:dayLbl,mult:u.mult,split:mx>0,days:ds});
  });
  cols.push({label:'직접',sub:'입력',mult:scaleCustom,custom:true});

  // 단계별 그룹핑
  const stages={};
  rec.ings.forEach(ing=>{
    const st=ing.stage||'본반죽';
    if(!stages[st]) stages[st]=[];
    stages[st].push(ing);
  });
  const ORDER=['풀리쉬','폴리쉬','사전반죽','탕종','본반죽','충전'];
  const stageNames=Object.keys(stages).sort((a,b)=>{
    const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });

  let h=`<table class="scale-table"><thead><tr><th class="name-col sc-name">재료</th>`;
  cols.forEach((c,i)=>{
    const cls=c.fixed?' sc-fixed':(c.custom?' sc-custom':(c.split?' sc-split':''));
    h+=`<th class="sc-col${cls}">${c.label}<span class="sc-sub">${c.sub}</span></th>`;
  });
  h+='</tr></thead><tbody>';

  let grandTotals=cols.map(()=>0);

  stageNames.forEach(st=>{
    const ings=stages[st];
    const showStage=stageNames.length>1;
    if(showStage){
      h+=`<tr class="sc-stage"><td colspan="${cols.length+1}">${st}</td></tr>`;
    }
    const stTotals=cols.map(()=>0);
    ings.forEach(ing=>{
      h+=`<tr><td class="name-cell sc-name-cell"><span class="sc-dot" style="background:${ING_TYPES[ing.type||'other'].color}"></span>${ing.n}</td>`;
      cols.forEach((c,i)=>{
        const g=ing.g*c.mult;
        stTotals[i]+=g; grandTotals[i]+=g;
        h+=`<td class="sc-cell${c.fixed?' sc-fixed':''}${c.custom?' sc-custom':''}${c.split?' sc-split':''}">${fmtG(g)}</td>`;
      });
      h+='</tr>';
    });
    if(showStage){
      h+=`<tr class="sc-subtotal"><td class="name-cell">${st} 합계</td>`;
      stTotals.forEach((t,i)=>{ h+=`<td class="${cols[i].fixed?'sc-fixed':''}${cols[i].custom?'sc-custom':''}${cols[i].split?'sc-split':''}">${fmtG(t)}</td>`; });
      h+='</tr>';
    }
  });

  h+=`<tr class="sc-total"><td class="name-cell">반죽 총합계</td>`;
  grandTotals.forEach((t,i)=>{ h+=`<td>${fmtG(t)}</td>`; });
  h+='</tr>';

  // ── 충전물 섹션 ──
  const fillProds=prodsOf(scaleDtype).filter(p=>(FILLINGS[p.name]||[]).length);
  if(fillProds.length){
    h+=`<tr class="sc-fill-divider"><td colspan="${cols.length+1}">충전물 (제품별 실제 수량 기준)</td></tr>`;
    const doughPerBatch=rec.ings.reduce((s,i)=>s+i.g,0);

    fillProds.forEach(p=>{
      const fl=FILLINGS[p.name];
      const fpc=fillPerPc(p.name);
      // 요일별 수량 요약
      const qtySummary=DAYS.map(d=>{
        const q=BATCH_MODE[scaleDtype]
          ? (batchQty[saleDay(d,OFFSETS[p.name]||0)]?.[p.name]||0)
          : qtyFor(p,d);
        return q>0?`${d} ${BATCH_MODE[scaleDtype]?q.toFixed(1)+'배':q+'개'}`:null;
      }).filter(Boolean).join(' · ');
      h+=`<tr class="sc-fill-prod"><td class="name-cell" colspan="${cols.length+1}"><div class="fp-line"><span class="fp-name">${p.name} <span class="sc-fill-note">완제품 ${p.split}g${fpc>0?` (충전 ${fmtG(fpc)})`:''}</span></span><span class="fp-qty">${qtySummary||'수량 없음'}</span></div></td></tr>`;

      fl.forEach(f=>{
        const isPc=(f.per||'pc')==='pc';
        h+=`<tr class="sc-fill-row"><td class="name-cell sc-name-cell"><span class="sc-dot" style="background:#e65100"></span>${f.n}<span class="base-g fill-base">(${fmtG(f.g)}${isPc?'/개':'/배합'})</span></td>`;
        cols.forEach(c=>{
          let v;
          if(!isPc){
            v=f.g*c.mult;
          } else if(c.fixed||c.custom||!c.days||!c.days.length){
            // 1배합 기준·직접입력: 배합당 개수로 환산
            const pcs=p.split>0?(doughPerBatch*c.mult/p.split):0;
            v=f.g*pcs;
          } else {
            // 요일 열: 그 요일들의 실제 제품 수량 평균 사용
            const qtys=c.days.map(d=>qtyFor(p,d));
            const avgQty=qtys.reduce((s,q)=>s+q,0)/qtys.length;
            // 그 요일 전체 배합수 대비 이 열(통)의 비중만큼 배분
            const dayTotalB=c.days.map(d=>calcBatchesFor(d)[scaleDtype]?.batches||0);
            const avgTotalB=dayTotalB.reduce((s,b)=>s+b,0)/dayTotalB.length;
            const share=avgTotalB>0?(c.mult/Math.max(avgTotalB,c.mult)):1;
            v=f.g*avgQty*Math.min(share,1);
          }
          h+=`<td class="sc-cell sc-fill-cell">${fmtG(v)}</td>`;
        });
        h+='</tr>';
      });
    });

    h+=`<tr class="sc-fill-note-row"><td colspan="${cols.length+1}">1개당 충전물은 해당 요일의 <b>실제 제품 수량</b>으로 계산됩니다</td></tr>`;
  }

  h+='</tbody></table>';

  // 직접입력 컨트롤
  // 요일별 배합수 요약
  let dayNote='<div class="sc-day-summary"><div class="sc-day-title">요일별 배합수</div><div class="sc-day-grid">';
  DAYS.forEach(d=>{
    const b=byDay[d][scaleDtype]?.batches||0;
    const parts=splitBatch(b,mx,scaleRoundUp);
    const wk=(d==='토'||d==='일')?' wk':'';
    if(b>0){
      const up=Math.ceil(b);
      const upTxt=parts.length>1?parts.join('+'):`${up}배`;
      dayNote+=`<div class="sc-day-item${wk}"><span class="sc-day-d">${d}</span><span class="sc-day-b">${b.toFixed(1)}배</span><span class="sc-day-split">${upTxt}</span></div>`;
    } else {
      dayNote+=`<div class="sc-day-item off${wk}"><span class="sc-day-d">${d}</span><span class="sc-day-b">-</span></div>`;
    }
  });
  dayNote+='</div></div>';

  h=dayNote+h;

  h+=`<div class="sc-max-note">${scaleRoundUp?'배합수 <b>올림</b> 적용 중 (예: 9.2배 → 10배)':'실제 계산된 배합수 그대로 표시'}${mx?` · 1회 최대 <b>${mx}배합</b> 초과 시 통별 분할`:''}</div>`;
  h+=`<div class="sc-input-bar">
    <span class="sc-input-lbl">직접 입력 배합수</span>
    <input class="sc-input" type="number" min="0.1" step="0.1" value="${scaleCustom}" oninput="onScaleCustom(this)">
    <span class="sc-input-hint">입력하면 '직접' 열이 자동 계산됩니다</span>
  </div>`;
  wrap.innerHTML=h;
}

function fmtG(g){
  if(g===0) return '<span style="color:#ddd">-</span>';
  if(g>=1000) return Math.round(g).toLocaleString();
  if(g>=100) return Math.round(g).toString();
  if(g>=10) return (Math.round(g*10)/10).toString();
  return (Math.round(g*100)/100).toString();
}

function onScaleCustom(el){
  scaleCustom=Math.max(0,parseFloat(el.value)||0);
  const cur=el.value;
  renderScaleTable();
  const ni=document.querySelector('.sc-input');
  if(ni){ ni.value=cur; ni.focus(); }
}

function switchTab(tab){
  curTab=tab;
  ['qty','result','scale','levain','recipe'].forEach(t=>{ document.getElementById(t+'Tab').style.display=t===tab?'block':'none'; document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active',t===tab); });
  document.getElementById('multiBar').style.display=(tab==='qty'&&selDays.length>0)?'flex':'none';
  if(tab==='result') renderResultTable();
  if(tab==='scale') renderScale();
  if(tab==='levain') renderLevain();
  if(tab==='recipe') renderRecipes();
}

loadSaved();
renderQtyTable();
</script>
