*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--surface-0);color:var(--text-primary);font-size:15px}

.save-time{font-size:12px;color:rgba(255,255,255,0.8);display:block}
.day-bar{background:#111827;padding:8px 16px;display:flex;gap:6px;overflow-x:auto}

.day-btn{padding:5px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.25);background:transparent;color:rgba(255,255,255,0.7);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.day-btn.active{background:#fff;color:#1a1a2e;border-color:#fff;font-weight:500}
.tabs{display:flex;background:var(--surface-2);border-bottom:0.5px solid var(--border)}
.tab{flex:1;padding:10px 0;text-align:center;font-size:13px;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--text-primary);border-color:#1a1a2e;font-weight:500}
.save-bar{display:flex;gap:8px;padding:10px 16px;background:var(--surface-1);border-bottom:0.5px solid var(--border)}
.save-btn{flex:1;padding:9px;border-radius:8px;background:#1a1a2e;color:#fff;border:none;font-size:13px;font-weight:500;cursor:pointer}
.reset-btn{padding:9px 16px;border-radius:8px;background:transparent;color:var(--text-secondary);border:0.5px solid var(--border-strong);font-size:13px;cursor:pointer}
.toast{position:absolute;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;top:8px;z-index:20}
.toast.show{opacity:1}
.sec-label{font-size:11px;font-weight:500;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;padding:12px 16px 4px}
.prod-row{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:0.5px solid var(--border)}
.prod-info{flex:1;min-width:0}
.prod-name{font-size:14px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-sub{font-size:11px;color:var(--text-muted)}
.qty-ctrl{display:flex;align-items:center;flex-shrink:0}
.qb{width:30px;height:30px;border-radius:7px;border:0.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;user-select:none}
.qb:active{background:var(--surface-0);transform:scale(.93)}
.qinput{width:46px;text-align:center;font-size:15px;font-weight:500;border:none;background:transparent;color:var(--text-primary);padding:0;-moz-appearance:textfield}
.qinput::-webkit-inner-spin-button,.qinput::-webkit-outer-spin-button{-webkit-appearance:none}
.rcard{background:var(--surface-2);border-radius:12px;border:0.5px solid var(--border);margin:12px 16px;overflow:hidden}
.rcard-hdr{padding:12px 14px 8px;font-size:12px;color:var(--text-muted);font-weight:500;border-bottom:0.5px solid var(--border)}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:0.5px solid var(--border)}
.rrow:last-child{border-bottom:none}
.rname{font-size:14px;font-weight:500;color:var(--text-primary)}
.rsub{font-size:11px;color:var(--text-secondary);margin-top:2px}
.rbatch{font-size:22px;font-weight:500;color:#1a1a2e}

.rtotal-lbl{font-size:13px;color:rgba(255,255,255,.65)}
.rtotal-val{font-size:18px;font-weight:500;color:#fff}

.recipe-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;border-bottom:0.5px solid var(--border)}
.recipe-title{font-size:14px;font-weight:500;color:var(--text-primary)}
.recipe-badge{font-size:11px;color:var(--text-muted);background:var(--surface-1);border-radius:4px;padding:2px 7px;border:0.5px solid var(--border)}
.recipe-body{padding:8px 0}
.recipe-row{display:flex;justify-content:space-between;padding:6px 14px;font-size:13px}
.recipe-row:nth-child(odd){background:var(--surface-1)}
.ing-name{color:var(--text-secondary)}
.ing-val{font-weight:500;color:var(--text-primary)}
.ing-pct{font-size:11px;color:var(--text-muted);margin-left:4px}
.divider{height:0.5px;background:var(--border);margin:0 14px}
.empty{text-align:center;padding:32px 20px;color:var(--text-muted);font-size:13px}
</style>

let today='월';
const qty={};
PRODUCTS.forEach(p=>qty[p.name]=p[DAY_TYPE['월']]);

function loadSaved(){
  try{
    const s=window.storage;
    if(!s) return;
    s.get('bakery_qty').then(r=>{
      if(r&&r.value){
        const d=JSON.parse(r.value);
        if(d.qty) Object.assign(qty,d.qty);
        if(d.day){today=d.day;document.querySelectorAll('.day-btn').forEach(b=>{b.classList.toggle('active',b.dataset.day===today)});}
      }
    }).catch(()=>{});
    s.get('bakery_savetime').then(r=>{
      if(r&&r.value) document.getElementById('saveTime').textContent=r.value;
    }).catch(()=>{});
  }catch(e){}
}

function saveData(){
  try{
    const s=window.storage;
    if(!s){showToast('저장 기능은 독립 앱 환경에서 사용 가능합니다');return;}
    const now=new Date();
    const timeStr=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    s.set('bakery_qty',JSON.stringify({qty,day:today}));
    s.set('bakery_savetime',timeStr);
    document.getElementById('saveTime').textContent=timeStr;
    showToast('저장했습니다');
  }catch(e){
    const now=new Date();
    const timeStr=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    document.getElementById('saveTime').textContent=timeStr;
    showToast('저장했습니다');
  }
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function resetToDefault(){
  const dt=DAY_TYPE[today];
  PRODUCTS.forEach(p=>qty[p.name]=p[dt]);
  renderProducts();
  showToast('기본 수량으로 초기화했습니다');
}

const dayBar=document.getElementById('dayBar');
DAYS.forEach(d=>{
  const btn=document.createElement('button');
  btn.className='day-btn'+(d===today?' active':'');
  btn.textContent=d+'요일';
  btn.dataset.day=d;
  btn.onclick=()=>{
    today=d;
    document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===d));
    const dt=DAY_TYPE[d];
    PRODUCTS.forEach(p=>{ if(qty[p.name]===undefined) qty[p.name]=p[dt]; });
    renderProducts();
    if(curTab==='result') renderResults();
  };
  dayBar.appendChild(btn);
});

function getGroups(){
  const g={};
  PRODUCTS.forEach(p=>{ if(!g[p.dtype]) g[p.dtype]=[]; g[p.dtype].push(p); });
  return g;
}

function renderProducts(){
  const list=document.getElementById('productList');
  list.innerHTML='';
  const groups=getGroups();
  Object.entries(groups).forEach(([dtype,prods])=>{
    const lbl=document.createElement('div');
    lbl.className='sec-label';lbl.textContent=dtype;
    list.appendChild(lbl);
    prods.forEach(p=>{
      const row=document.createElement('div');
      row.className='prod-row';
      const q=qty[p.name]??0;
      row.innerHTML=`<div class="prod-info"><div class="prod-name">${p.name}</div><div class="prod-sub">${p.split}g/개</div></div>
      <div class="qty-ctrl">
        <div class="qb" onclick="adj('${p.name}',-1)">−</div>
        <input class="qinput" type="number" min="0" value="${q}" onchange="setQ('${p.name}',this.value)">
        <div class="qb" onclick="adj('${p.name}',1)">+</div>
      </div>`;
      list.appendChild(row);
    });
  });
}

function adj(name,d){
  qty[name]=Math.max(0,(qty[name]||0)+d);
  renderProducts();
  if(curTab==='result') renderResults();
}
function setQ(name,v){
  qty[name]=Math.max(0,parseInt(v)||0);
  if(curTab==='result') renderResults();
}

function calcBatches(){
  const dtypes=[...new Set(PRODUCTS.map(p=>p.dtype))];
  const result={};
  dtypes.forEach(dtype=>{
    const prods=PRODUCTS.filter(p=>p.dtype===dtype);
    const recipe=RECIPE_TOTALS[dtype];
    if(!recipe) return;
    let batches,total_g;
    if(dtype==='식빵'){
      const normal=prods.filter(p=>p.name!=='소금빵'&&p.name!=='초코 모닝빵');
      const normalG=normal.reduce((s,p)=>s+(qty[p.name]||0)*p.split,0);
      const sgG=(qty['소금빵']||0)*70;
      const chocoG=(qty['초코 모닝빵']||0)*29.1;
      const mokaB=result['모카빵']?result['모카빵'].batches:0;
      const normalB=normalG>0?Math.ceil(normalG/(SIK_TOTAL-MUKBAN)*10)/10:0;
      const mukbanG=(normalB+mokaB)*MUKBAN;
      const need=sgG+chocoG+mukbanG;
      batches=need>0?Math.ceil(need/(SIK_TOTAL-MUKBAN)*10)/10:normalB;
      if(normalG>0) batches=Math.max(batches,normalB);
      total_g=batches*(SIK_TOTAL-MUKBAN);
    } else {
      total_g=prods.reduce((s,p)=>s+(qty[p.name]||0)*p.split,0);
      batches=total_g>0?Math.ceil(total_g/recipe*10)/10:0;
    }
    result[dtype]={batches,total_g,recipe};
  });
  return result;
}

  let html='<div class="rcard"><div class="rcard-hdr">'+today+'요일 배합수 (0.1 단위)</div>';
  let total=0,any=false;
  Object.entries(batches).forEach(([dtype,d])=>{
    if(!d.batches) return;
    any=true;total+=d.batches;
    html+=`<div class="rrow"><div><div class="rname">${LABEL[dtype]||dtype}</div><div class="rsub">${Math.round(d.total_g).toLocaleString()}g 필요</div></div><div style="text-align:right"><div class="rbatch">${d.batches.toFixed(1)}</div><div class="rsub">배합</div></div></div>`;
  });
  if(!any) html+='<div class="empty">수량을 입력하면 배합수가 계산됩니다.</div>';
  html+='</div>';
  if(any) html+=`<div class="rtotal"><span class="rtotal-lbl">전체 합계</span><span class="rtotal-val">${total.toFixed(1)} 배합</span></div>`;
  tab.innerHTML=html;
}

function renderRecipes(){
  const tab=document.getElementById('recipeTab');
  let html='<div style="height:8px"></div>';
  const NAMES={단과자:'단과자',바타르:'바타르',식빵:'식빵',모카빵:'모카빵',잡곡식빵:'잡곡식빵',펌퍼니클:'펌퍼니클',크루아상:'크루아상',치아바타:'치아바타/포카치아'};
  Object.entries(RECIPES).forEach(([key,rec])=>{
    const label=NAMES[key]||key;
    html+=`<div class="recipe-card">
    <div class="recipe-hdr" onclick="toggleRecipe('${key}')">
      <span class="recipe-title">${label}</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="recipe-badge">1배합 ${Math.round(rec.total).toLocaleString()}g</span>
        <i class="ti ti-chevron-down" id="icon-${key}" style="font-size:16px;color:var(--text-muted);transition:transform .2s" aria-hidden="true"></i>
      </div>
    </div>
    <div id="recipe-${key}" style="display:none">
      <div class="recipe-body">`;
    rec.ings.forEach((ing,i)=>{
      html+=`<div class="recipe-row">
        <span class="ing-name">${ing.n}</span>
        <span class="ing-val">${ing.g}g<span class="ing-pct">${ing.pct!=='—'?`(${ing.pct}%)`:'(풀리쉬/본반죽)'}</span></span>
      </div>`;
    });
    html+=`</div><div class="divider"></div>
      <div style="display:flex;justify-content:space-between;padding:10px 14px;font-size:13px">
        <span style="color:var(--text-secondary)">1배합 총무게</span>
        <span style="font-weight:500">${Math.round(rec.total).toLocaleString()}g</span>
      </div>
    </div></div>`;
  });
  html+='<div style="height:16px"></div>';
  tab.innerHTML=html;
}

function toggleRecipe(key){
  const body=document.getElementById('recipe-'+key);
  const icon=document.getElementById('icon-'+key);
  const open=body.style.display==='none';
  body.style.display=open?'block':'none';
  icon.style.transform=open?'rotate(180deg)':'rotate(0)';
}

let curTab='qty';
function switchTab(tab){
  curTab=tab;
  ['qty','result','recipe'].forEach(t=>{
    document.getElementById(t+'Tab').style.display=t===tab?'block':'none';
    document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.toggle('active',t===tab);
  });
  if(tab==='result') renderResults();
  if(tab==='recipe') renderRecipes();
}

loadSaved();
renderProducts();
</script>
